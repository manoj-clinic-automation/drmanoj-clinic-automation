<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Command console</title>
<style>
/* S481_COMMAND_CONSOLE -- the owner's console. A phone-width column: the Today card, then a stack of collapsed sections,
   each a count and a word; every line opens the page that owns it. The page only DRAWS the reading the server made. */
:root{
  --bg:#f3f2ed; --paper:#ffffff; --fg:#1d211f; --muted:#6a706b; --line:#dbd8cf; --chip:#ecebe4;
  --accent:#1f5f4a; --accent-ink:#fff; --good:#2f7a4e; --warn:#b07a12; --warn-ink:#7d5200; --bad:#a8402f;
  --tilebg:#1f5f4a; --tilefg:#f2f7f4; --tilemute:#b9d4c8; --tilewarn:#f0c56a; --tilebad:#ffb3a3; --tilegood:#9fe0c0;
  --display:Georgia,"Times New Roman",serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141718; --paper:#1e2325; --fg:#e9e7e0; --muted:#98a09a; --line:#333a3c; --chip:#2a3133;
  --accent:#72c4a4; --accent-ink:#0f1a15; --good:#6cc392; --warn:#e0b25a; --warn-ink:#e0b25a; --bad:#e58b78;
  --tilebg:#163f33; --tilefg:#eaf4ef; --tilemute:#8fb8a7; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 60px}
.top{display:flex;align-items:center;gap:8px 10px;margin-bottom:12px;flex-wrap:wrap}
.back{border:1px solid var(--line);background:var(--paper);color:var(--fg);border-radius:8px;padding:0 14px;min-height:42px;display:inline-flex;align-items:center;font:inherit;font-size:.86rem;text-decoration:none;white-space:nowrap}
.top strong{font-family:var(--display);font-size:1.1rem;white-space:nowrap}
.asof{margin-left:auto;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:8px;padding:0 14px;min-height:42px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.asof:disabled{opacity:.7;cursor:default}
.warnbar{background:var(--chip);border-left:3px solid var(--warn);border-radius:6px;padding:8px 10px;font-size:.82rem;margin:0 0 10px}
.tile{background:var(--tilebg);color:var(--tilefg);border-radius:14px;padding:16px 16px 12px;margin-bottom:14px}
.tile .t{font-family:var(--display);font-size:1.1rem;font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.tile .t small{font-family:var(--body);font-size:.75rem;color:var(--tilemute);font-weight:400}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kpi b{display:block;font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:.75rem;color:var(--tilemute)}
.kpi b.w{color:var(--tilewarn)}.kpi b.b{color:var(--tilebad)}.kpi b.g{color:var(--tilegood)}
.tile .foot{margin-top:12px;font-size:.8rem;color:var(--tilemute)}
details.sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 14px;min-height:52px;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
.name{flex:1;min-width:0;display:flex;flex-direction:column}
.nm{font-weight:600}
.word{font-size:.76rem;color:var(--muted)}
.cnt{font-size:.78rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--chip);color:var(--muted);white-space:nowrap}
.cnt.g{color:var(--good)}.cnt.w{color:var(--warn-ink)}.cnt.b{color:var(--bad)}
.caret{color:var(--muted);transition:transform .15s}
details[open]>summary .caret{transform:rotate(90deg)}
.body{padding:0 14px 10px;border-top:1px solid var(--line)}
.line{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.line:last-child{border-bottom:0}
.line.sub{margin-left:19px;padding:7px 0;font-size:.86rem}
.dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.dot.g{background:var(--good)}.dot.w{background:var(--warn)}.dot.b{background:var(--bad)}.dot.n{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.line .m{flex:1;min-width:0;overflow-wrap:break-word}
.line .who{display:block;font-size:.78rem;color:var(--muted)}
.line>a{font-size:.8rem;color:var(--accent);white-space:nowrap;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:0 14px;min-height:42px;display:inline-flex;align-items:center}
details.sub2{flex-basis:100%;margin:0 0 2px 19px;min-width:0}
details.sub2>summary{cursor:pointer;font-size:.8rem;color:var(--accent);list-style:none;display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:8px}
details.sub2>summary::-webkit-details-marker{display:none}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.8rem;margin:6px 0 2px;font-variant-numeric:tabular-nums}
td,th{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.wait{color:var(--muted);text-align:center;padding:30px 0}
.note{color:var(--muted);font-size:.78rem;margin:14px 2px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="/portal">&larr; Home</a><strong>Command console</strong><button class="asof" id="asof" type="button">reading&hellip;</button></div>
  <div class="warnbar" id="warn" hidden></div>
  <div class="tile" id="tile" hidden>
    <div class="t"><span id="tDay">Today</span><small id="tAsOf"></small></div>
    <div class="kpis">
      <div class="kpi"><b id="kClinic">&ndash;</b><span id="kClinicW">Clinic</span></div>
      <div class="kpi"><b id="kSanj">&ndash;</b><span id="kSanjW">Sanjeevni</span></div>
      <div class="kpi"><b id="kNeeds">&ndash;</b><span id="kNeedsW">waiting for you</span></div>
      <div class="kpi"><b id="kWork">&ndash;</b><span id="kWorkW">staff work</span></div>
    </div>
    <div class="foot" id="tFoot"></div>
  </div>
  <div id="secs"><p class="wait" id="wait">Reading the clinic&hellip; a few seconds.</p></div>
  <p class="note">This page only reads. Every line opens the page that owns it; approving is done there.</p>
</div>
<script>
(function(){
  var S=null, LABEL='', openKeys={}, firstDraw=true, tries=0, timer=null, fills={};
  function $(id){return document.getElementById(id);}
  function el(tag,cls,text){var e=document.createElement(tag); if(cls)e.className=cls; if(text!==undefined&&text!==null)e.textContent=text; return e;}
  function put(id,v){var e=$(id); if(e&&v!==undefined&&v!==null)e.textContent=v;}
  function cls(id,c){var e=$(id); if(e)e.className=c||'';}

  function tile(t,s){
    if(!t)return;
    $('tile').hidden=false;
    put('tDay','Today · '+(s.day_words||'')); put('tAsOf',LABEL||('as of '+(s.as_of_hm||'')));
    put('kClinic',t.clinic||'–'); cls('kClinic',t.clinic_cls==='g'?'':t.clinic_cls); put('kClinicW',t.clinic_word||'Clinic');
    put('kSanj',t.sanj||'–'); cls('kSanj',t.sanj_cls==='g'?'':t.sanj_cls); put('kSanjW',t.sanj_word||'Sanjeevni');
    var n=t.needs_n||0; put('kNeeds',String(n)); cls('kNeeds',n?(t.needs_late?'b':'w'):'g');
    put('kNeedsW','waiting for you'+(t.needs_late?(' · '+t.needs_late+' late'):''));
    var late=(t.work_late||0)+(t.work_not_done||0); put('kWork',String(late)); cls('kWork',late?(t.work_not_done?'b':'w'):'g');
    var w='staff duties late';
    if(t.att_total)w+=' · '+t.att_in+' of '+t.att_total+' in';
    put('kWorkW',w);
    put('tFoot','System: '+(t.sys_word||'not read'));
  }

  function line(l){
    var d=el('div','line'+(l.sub?' sub':''));
    var dot=el('span','dot '+(l.dot||'n')); d.appendChild(dot);
    var m=el('div','m');
    if(l.b)m.appendChild(el('b',null,l.b));
    var t=el('span',null,l.text||'');
    if(l.fill){t.setAttribute('data-fill',l.fill);}
    m.appendChild(t);
    if(l.who)m.appendChild(el('span','who',l.who));
    d.appendChild(m);
    if(l.why)d.title=l.why;
    if(l.href){var a=el('a',null,'Open'); a.href=l.href; a.target='_blank'; a.rel='noopener'; if(l.link){a.title=l.link; a.setAttribute('aria-label','Open '+l.link);} d.appendChild(a);}
    if(l.table&&l.table.rows&&l.table.rows.length){
      var ds=el('details','sub2'); ds.appendChild(el('summary',null,(l.tlabel||'details')));
      var tw=el('div','tw'), tb=el('table'), hr=el('tr'), i, j, r, tr, num=[], c;
      for(j=0;j<(l.table.head||[]).length;j++){ num[j]=true; for(i=0;i<l.table.rows.length;i++){ if(!/^[-–−₹0-9]/.test(String(l.table.rows[i][j]||'–'))){num[j]=false;break;} } }
      for(j=0;j<(l.table.head||[]).length;j++){ c=el('th',num[j]?'num':null,l.table.head[j]); hr.appendChild(c); }
      tb.appendChild(hr);
      for(i=0;i<l.table.rows.length;i++){ r=l.table.rows[i]; tr=el('tr'); for(j=0;j<r.length;j++)tr.appendChild(el('td',num[j]?'num':null,r[j])); tb.appendChild(tr); }
      tw.appendChild(tb); ds.appendChild(tw); d.appendChild(ds);
    }
    return d;
  }

  function draw(){
    var box=$('secs'); box.textContent='';
    var order=S.order||[], i, k, x, sec, sum, body, j, nm;
    for(i=0;i<order.length;i++){
      k=order[i]; x=(S.sections||{})[k]; if(!x)continue;
      if(firstDraw&&x.open)openKeys[k]=true;
      sec=el('details','sec'); sec.setAttribute('data-k',k); if(openKeys[k])sec.open=true;
      sum=el('summary'); sum.appendChild(el('span','caret','▸'));
      nm=el('span','name'); nm.appendChild(el('span','nm',x.name||k)); if(x.word)nm.appendChild(el('span','word',x.word)); sum.appendChild(nm);
      sum.appendChild(el('span','cnt '+(x.cls||''),x.chip||''));
      sec.appendChild(sum);
      body=el('div','body');
      for(j=0;j<(x.lines||[]).length;j++)body.appendChild(line(x.lines[j]));
      sec.appendChild(body);
      sec.addEventListener('toggle',(function(key,node){return function(){openKeys[key]=node.open;};})(k,sec));
      box.appendChild(sec);
    }
    firstDraw=false;
    tile(S.tile,S);
    applyFills();
  }

  function setFill(key,text,dot){
    fills[key]={text:text,dot:dot}; applyFills();
  }
  function applyFills(){
    var nodes=document.querySelectorAll('[data-fill]'), i, f, row, d;
    for(i=0;i<nodes.length;i++){
      f=fills[nodes[i].getAttribute('data-fill')]; if(!f)continue;
      nodes[i].textContent=f.text;
      row=nodes[i].parentNode.parentNode; d=row?row.querySelector('.dot'):null; if(d)d.className='dot '+f.dot;
    }
  }
  function loadFills(){
    fetch('/finance/api/tile-summary',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
      if(!d||!d.ok){setFill('health','Health: not read here; open the health page','n');return;}
      if(d.health_line)setFill('health','Health: '+d.health_line,'w'); else setFill('health','Health: all clear','g');
    }).catch(function(){setFill('health','Health: not read here; open the health page','n');});
    fetch('/portal/review-counts',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
      if(!d||typeof d.to_enter==='undefined'){setFill('reg','Staff register: not read here; open the register','n');return;}
      var s='Staff register: '+d.to_enter+' day'+(d.to_enter===1?'':'s')+' to enter';
      if(d.show_approve)s+=' · '+d.to_approve+' to approve';
      setFill('reg',s,(d.to_enter||(d.show_approve&&d.to_approve))?'w':'g');
    }).catch(function(){setFill('reg','Staff register: not read here; open the register','n');});
  }

  function status(d){
    var b=$('asof'), w=$('warn'), hm=d.as_of_label||'';
    LABEL=hm; if(S)put('tAsOf',hm);
    if(d.building){b.textContent=(hm?(hm+' · '):'')+'reading again…'; b.disabled=true;}
    else{b.textContent=(hm||'no reading yet')+' · refresh'; b.disabled=false;}
    if(d.build_error){w.hidden=false; w.textContent='The last reading did not finish ('+d.build_error+'). You are seeing the one before it'+(hm?(' ('+hm+')'):'')+'.';}
    else if(S&&S.failed&&S.failed.length){w.hidden=false; w.textContent='Part of this reading could not be made: '+S.failed.join(', ')+'. The rest is complete.';}
    else w.hidden=true;
  }

  function note(text){
    var b=$('asof'), w=$('wait');
    b.disabled=false; b.textContent=(LABEL||'no reading')+' · refresh';
    if(w)w.textContent=text; else { var x=$('warn'); x.hidden=false; x.textContent=text; }
  }

  function load(force){
    if(timer){clearTimeout(timer);timer=null;}
    fetch('/finance/console/api/state'+(force?'?refresh=1':''),{credentials:'same-origin'})
     .then(function(r){
       if(r.status===403){ $('secs').textContent=''; $('secs').appendChild(el('p','wait','This page is the owner\'s. Your login does not open it.')); return null; }
       var ct=r.headers.get('Content-Type')||'';
       if(r.ok&&ct.indexOf('json')<0){ note('Your login has ended. Open the Clinic app again and come back.'); return null; }
       if(!r.ok){ note('The server answered '+r.status+'. Tap refresh in a minute.'); return null; }
       return r.json();
     })
     .then(function(d){
       if(!d)return;
       if(!d.ok){ note('The reading could not be fetched. Tap refresh in a minute.'); return; }
       LABEL=d.as_of_label||'';
       if(d.snapshot&&(!S||S.built_epoch!==d.snapshot.built_epoch)){S=d.snapshot; draw();}
       status(d);
       if(d.building&&tries<24){tries++; timer=setTimeout(function(){load(false);},2500);}
       else{ tries=0; if(d.building){ var b=$('asof'); b.disabled=false; b.textContent=(d.as_of_label||'no reading yet')+' · still reading · refresh'; } }
     })
     .catch(function(){ note('The server did not answer. Tap refresh in a minute.'); });
  }

  $('asof').addEventListener('click',function(){tries=0; load(true); loadFills();});
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){tries=0; load(false);} });
  setInterval(function(){ if(!document.hidden){tries=0; load(false);} },300000);
  load(false); loadFills();
})();
</script>
</body>
</html>
