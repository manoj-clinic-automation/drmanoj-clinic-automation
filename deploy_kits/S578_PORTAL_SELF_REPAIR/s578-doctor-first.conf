# kit S578_PORTAL_SELF_REPAIR (S325, 18-Oct-2026, D734) -- placed at
#   /etc/systemd/system/clinic-watchdog.service.d/s578-doctor-first.conf
# Every 5 minutes, on the watchman's own timer, the repair runs FIRST (clinic-doctor --auto: at most one restart
# per part per hour, a phone line only when it fixed or could not fix something), and then the watchman reports
# whatever is still down. The leading "-" means a NOT FIXED verdict never stops the watchman from running.
# Switch the repair off without touching this file:  touch /root/deploy/_off/DOCTOR_AUTO_OFF
[Service]
ExecStartPre=-/usr/local/bin/clinic-doctor --auto
TimeoutStartSec=900
