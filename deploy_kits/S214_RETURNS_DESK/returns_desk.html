<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>वापसी डेस्क — Sanjeevni</title>
<style>
:root{--bg:#0e1b1e;--card:#14262b;--line:#1f3a41;--ink:#e8f1f2;--dim:#9db4b8;
--teal:#2aa198;--green:#2e9e5b;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:16px/1.4 system-ui,'Noto Sans Devanagari',sans-serif;padding-bottom:110px}
.wrap{max-width:760px;margin:0 auto;padding:8px}
.steps{position:sticky;top:0;z-index:8;display:flex;gap:6px;background:var(--bg);
padding:8px;border-bottom:1px solid var(--line)}
.steps button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--line);
background:var(--card);color:var(--dim);font-weight:700;font-size:14px}
.steps button.on{background:var(--teal);color:#04282c;border-color:var(--teal)}
.steps button:disabled{opacity:.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:10px;margin:10px 0}
input,select{font:inherit;border-radius:10px;border:1px solid var(--line);
background:#0b1517;color:var(--ink);padding:12px;width:100%}
button{font:inherit;border-radius:10px;cursor:pointer}
.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal);padding:9px 12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;
border-top:1px solid var(--line);padding:9px 2px}
.item .l{min-width:0;flex:1}
.item .nm{font-weight:600}
.item .sub{color:var(--dim);font-size:13px;line-height:1.35}
.item.inCart{background:#0f2e26;border-radius:8px;padding-left:6px}
.tag{font-size:13px;border:1px solid var(--teal);border-radius:14px;padding:5px 11px;
color:var(--teal);white-space:nowrap;background:none}
.tag.sel{background:#0f2e26;color:var(--ink);border-color:var(--line)}
.redtxt{color:#ff9d8f}
.qtybox{display:flex;gap:5px;align-items:center}
.qtybox input{width:82px;text-align:center;padding:10px 4px;font-size:17px}
.qtybox .okb{background:var(--teal);color:#04282c;border:none;padding:10px 14px;font-weight:800}
.cartline{border-top:1px solid var(--line);padding:9px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:46px;height:44px;font-size:20px;background:#0b1517;color:var(--ink);
border:1px solid var(--line)}
.qty input{width:70px;text-align:center;padding:9px 4px;font-size:17px}
.cond{font-size:13px;padding:7px 11px;border-radius:16px;border:1px solid var(--line);
background:#0b1517;color:var(--ink)}
.cond.bad{background:#3a1512;border-color:var(--red);color:#ffb4a8}
.total{font-size:19px;font-weight:800}
.dim{color:var(--dim);font-size:13px}
.hide{display:none!important}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0c2a2f;border-top:2px solid var(--teal);
padding:10px 12px;z-index:9}
.bar .row{max-width:760px;margin:0 auto}
.bar button{background:var(--teal);color:#04282c;border:none;font-weight:800;
font-size:17px;padding:13px 20px}
.overlay{position:fixed;inset:0;background:rgba(5,15,17,.92);z-index:20;display:flex;
flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:19px}
.spin{width:42px;height:42px;border:5px solid var(--line);border-top-color:var(--teal);
border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#printArea{display:none}
@media print{body{background:#fff;padding:0}body>*{display:none!important}
#printArea{display:block!important;color:#000;font:14px/1.5 system-ui,'Noto Sans Devanagari',sans-serif;padding:6mm}
#printArea table{width:100%;border-collapse:collapse}
#printArea td,#printArea th{border:1px solid #444;padding:4px 6px;text-align:left}
#printArea .foot{font-size:12px;border-top:1px solid #444;margin-top:4mm;padding-top:2mm}}
</style>
</head>
<body>
<div class="steps">
 <button id="st1" class="on" onclick="go(1)">1 मरीज</button>
 <button id="st2" disabled onclick="go(2)">2 दवाएँ</button>
 <button id="st3" disabled onclick="go(3)">3 पर्ची</button>
 <button class="ghost" style="flex:0 0 auto" onclick="resetAll()">↺</button>
</div>
<div class="wrap">

<div id="p1">
 <div class="card">
  <input id="q" placeholder="नाम / क्लिनिक ID / फ़ोन के आख़िरी 4 अंक" autocomplete="off">
  <div id="plist"></div>
 </div>
 <div class="card">
  <div class="row"><b>आज की पर्चियाँ</b><button class="ghost" onclick="loadSlips()">↻</button></div>
  <div id="todaySlips" class="dim">—</div>
 </div>
</div>

<div id="p2" class="hide">
 <div class="card">
  <div class="row"><b id="pname"></b><button class="ghost" onclick="go(1)">↩ पीछे</button></div>
  <button class="ghost" style="margin-top:8px;width:100%"
   onclick="document.getElementById('catbox').classList.toggle('hide');document.getElementById('cf').focus()">
   + बिना बिल की दवा (दुकान के रिकॉर्ड से)</button>
  <div id="catbox" class="hide" style="margin-top:8px">
   <input id="cf" placeholder="दवा का नाम टाइप करें…" autocomplete="off"
    oninput="catSearch(this.value.trim().toLowerCase())">
   <div id="catlist"></div>
  </div>
  <div id="selpanel" class="hide" style="margin-top:8px;border:1px solid var(--teal);
   border-radius:10px;padding:6px 8px">
   <div class="dim" style="font-weight:700">चुनी हुई दवाएँ</div>
   <div id="sellist"></div>
  </div>
  <div id="ilist"></div>
 </div>
</div>

<div id="p3" class="hide">
 <div class="card">
  <div class="row"><b>पर्ची — <span id="pname2"></span></b>
  <button class="ghost" onclick="go(2)">↩ और दवा</button></div>
  <div id="cart"></div>
  <div class="row" style="margin-top:8px"><span>कुल वापसी (net, बिल की छूट के हिसाब से)</span>
   <span class="total" id="tot">₹0</span></div>
 </div>
 <div class="card">
  <div class="dim">रक़म का निपटान <b style="color:var(--ink)">medical sales counter</b> पर होगा —
   मरीज यह पर्ची वहाँ दिखाएगा (नक़द या नई ख़रीद में adjust)।</div>
  <div class="dim" id="msg" style="margin-top:8px"></div>
 </div>
</div>
</div>

<div class="bar hide" id="bar">
 <div class="row">
  <span id="barTxt" class="total">—</span>
  <button id="barBtn" onclick="barGo()">आगे →</button>
 </div>
</div>

<div class="overlay hide" id="ov"><div class="spin"></div>
 <div>प्रोसेस हो रहा है…<br><span class="dim">बिल मिलाए जा रहे हैं</span></div></div>

<div id="printArea"></div>

<script>
"use strict";
var USER=__DESK_USER__;
var API=location.pathname.replace(/\/$/,'')+'/api';
var HI={expired:'दवा expiry निकल चुकी है',damaged_or_opened:'पैकिंग खुली/ख़राब है',
 not_ours:'हमारे यहाँ की नहीं है'};
var POLICY='वापसी नियम: हर दवा उसकी बिक्री की तारीख़ से 2 महीने के अंदर, सील बंद हालत में वापस/बदली जा सकती है। खुली, ख़राब या expiry निकली दवा वापस नहीं हो सकती।<br>निवेदन: वापसी हो तो आख़िरी ख़रीद की दवाएँ तुरंत लौटाएँ — पुरानी ख़रीदों की दवाएँ रोक कर बाद में एक साथ लौटाना आगे संभव नहीं हो पाएगा।';
var patient=null, items=[], cart=[], openKey=null, pend={}, step=1;

function $(id){return document.getElementById(id);}
function rupee(p){return '₹'+((p||0)/100).toLocaleString('en-IN',{maximumFractionDigits:2});}
function cssk(k){return String(k).replace(/[^a-zA-Z0-9]/g,'_');}
function billShort(b){return String(b||'').replace(/^A0*/,'');}
function unitWord(name){
 var n=String(name||'').toUpperCase();
 if(/\bTAB/.test(n))return 'गोली';
 if(/\bCAP/.test(n))return 'कैप्सूल';
 if(/SYR|SUSP|SOLN|SOLUTION|DROP/.test(n))return 'शीशी';
 if(/OINT|GEL\b|CREAM|LOTION/.test(n))return 'ट्यूब';
 if(/\bINJ|VIAL|AMP/.test(n))return 'इंजेक्शन';
 if(/SPRAY/.test(n))return 'स्प्रे';
 if(/POWDER|SACHET/.test(n))return 'पाउच';
 return 'नग';
}
function cartOf(k){for(var i=0;i<cart.length;i++)if(cart[i].key===k)return cart[i];return null;}

function go(n){
 ['p1','p2','p3'].forEach(function(p,i){$(p).classList.toggle('hide',i!==n-1);});
 [1,2,3].forEach(function(i){$('st'+i).classList.toggle('on',i===n);});
 step=n; drawBar();
}
function resetAll(){patient=null;items=[];cart=[];openKey=null;pend={};
 $('q').value='';$('plist').innerHTML='';$('st2').disabled=true;$('st3').disabled=true;
 $('msg').textContent='';
 $('catbox').classList.add('hide');$('cf').value='';$('catlist').innerHTML='';
 go(1);loadSlips();}

$('q').addEventListener('input',function(e){
 var q=e.target.value.trim(); if(q.length<2){$('plist').innerHTML='';return;}
 fetch(API+'/search?q='+encodeURIComponent(q)).then(function(r){return r.json();})
 .then(function(j){
  $('plist').innerHTML=(j.patients||[]).map(function(p){
   return '<div class="item" onclick=\'pick('+JSON.stringify(JSON.stringify(p))+')\'>'
    +'<span class="l"><span class="nm">'+(p.name||'—')+'</span><br>'
    +'<span class="sub">'+(p.clinic_id||'')+(p.last4?(' · ***'+p.last4):'')+'</span></span>'
    +'<span class="tag">चुनें</span></div>';}).join('')
   ||'<div class="dim" style="padding:8px">कोई नहीं मिला</div>';
 });
});

function pick(s){
 patient=JSON.parse(s);
 $('pname').textContent=patient.name||('ID '+patient.id);
 $('pname2').textContent=patient.name||'';
 $('st2').disabled=false; go(2);
 $('ilist').innerHTML='<div class="dim" style="padding:8px">लोड हो रही है…</div>';
 fetch(API+'/items?pid='+patient.id).then(function(r){return r.json();})
 .then(function(j){items=j.items||[];redraw();});
}

function priceTxt(it){
 var p=(it.unit_net_p!=null?it.unit_net_p:it.unit_p)||0;
 var w=unitWord(it.item_name);
 if(it.pack_n){
  var sp=p*it.pack_n, smrp=(it.unit_p||0)*it.pack_n;
  return (it.discounted?('net '+rupee(sp)+' <s style="opacity:.6">'+rupee(smrp)+'</s>')
          :rupee(sp))+' / पत्ता ('+it.pack_n+' '+w+')';
 }
 return (it.discounted?('net '+rupee(p)+' <s style="opacity:.6">'+rupee(it.unit_p)+'</s>')
         :rupee(p))+' / '+w;
}
function billsTxt(it){
 return (it.bills||[]).map(function(b){
  return billShort(b.bill_no)+' '+String(b.date||'').slice(5)
   +(b.units?(' · <b style="color:var(--ink);font-size:14px">'+b.units+'</b>'):'')
   +(b.disc_pct?(' · '+b.disc_pct+'%'):'');
 }).join('  |  ');
}
function row(it,fromCat){
 var k=it.item_key||it.item_name, c=cartOf(k), right;
 if(openKey===k){
  right='<span class="qtybox"><input type="number" id="qb_'+cssk(k)+'" inputmode="numeric"'
   +' placeholder="कितनी?" onkeydown="if(event.key===\'Enter\')confQty()">'
   +'<button class="okb" onclick="event.stopPropagation();confQty()">✔</button></span>';
 }else if(c){
  right='<span class="tag sel">✔ '+c.units+' '+unitWord(c.item_name)+'</span>';
 }else{
  right='<span class="tag">+ जोड़ें</span>';
 }
 var sub=fromCat?('बिना बिल · '+priceTxt(it))
               :(priceTxt(it)+(it.bills&&it.bills.length?('<br>'+billsTxt(it)):''));
 return '<div class="item'+(c?' inCart':'')+'" onclick=\'tapRow('
  +JSON.stringify(JSON.stringify(it))+','+(fromCat?'true':'false')+')\'>'
  +'<span class="l"><span class="nm">'+it.item_name
  +(it.last_expired?' <span class="redtxt">· expiry निकली</span>':'')+'</span><br>'
  +'<span class="sub">'+sub+'</span></span>'+right+'</div>';
}
function drawItems(){
 $('ilist').innerHTML=items.map(function(it){return row(it,false);}).join('')
  ||'<div class="dim" style="padding:8px">इस मरीज की कोई ख़रीद दर्ज नहीं — नीचे "बिना बिल" से लें</div>';
 focusQty();
}
function catSearch(q){
 if(q.length<2){$('catlist').innerHTML='';return;}
 $('catlist').innerHTML='<div class="dim" style="padding:6px">खोज रही है…</div>';
 fetch(API+'/catalog?q='+encodeURIComponent(q)).then(function(r){return r.json();})
 .then(function(j){
  $('catlist').innerHTML=(j.items||[]).map(function(it){return row(it,true);}).join('')
   ||'<div class="dim" style="padding:6px">रिकॉर्ड में नहीं मिली</div>';
  focusQty();
 }).catch(function(){});
}
function focusQty(){
 if(openKey!==null){var el=$('qb_'+cssk(openKey));if(el)el.focus();}
}
function drawSel(){
 $('selpanel').classList.toggle('hide',cart.length===0);
 $('sellist').innerHTML=cart.map(function(c,i){
  return '<div class="row" style="border-top:1px solid var(--line);padding:7px 0">'
   +'<span class="l" style="min-width:0"><b>'+c.item_name+'</b>'
   +'<br><span class="dim">'+conv(c)+' · '+rupee(c.amount_p)+'</span></span>'
   +'<span class="qty">'
   +'<button onclick="event.stopPropagation();sq('+i+',-1)">−</button>'
   +'<input type="number" inputmode="numeric" value="'+c.units+'" data-prev="'+c.units+'"'
   +' onfocus="this.dataset.prev=this.value;this.value=\'\'"'
   +' onblur="if(this.value===\'\')this.value=this.dataset.prev"'
   +' onchange="sqset('+i+',this.value)">'
   +'<button onclick="event.stopPropagation();sq('+i+',1)">+</button>'
   +'<button style="background:#0b1517;color:var(--dim);border:1px solid var(--line)"'
   +' onclick="event.stopPropagation();srm('+i+')">✕</button></span></div>';}).join('');
}
function sq(i,d){var c=cart[i];c.units=Math.max(1,c.units+d);if(c.cap&&c.units>c.cap)c.units=c.cap;
 c.amount_p=(c.unit_net_p||c.unit_p)*c.units;redraw();}
function sqset(i,v){var c=cart[i];c.units=Math.max(1,parseInt(v,10)||1);if(c.cap&&c.units>c.cap)c.units=c.cap;
 c.amount_p=(c.unit_net_p||c.unit_p)*c.units;redraw();}
function srm(i){cart.splice(i,1);redraw();}
function redraw(){
 drawSel();
 drawItems();
 if(!$('catbox').classList.contains('hide'))
  catSearch(($('cf').value||'').trim().toLowerCase());
 drawBar();
}
function tapRow(sit,fromCat){
 var it=JSON.parse(sit), k=it.item_key||it.item_name;
 if(cartOf(k)){cart=cart.filter(function(c){return c.key!==k;});openKey=null;}
 else{openKey=k;pend[k]=it;}
 redraw();
}
function capOf(it){return (it&&it.bought_units&&it.item_key)?it.bought_units:0;}
function confQty(){
 if(openKey===null)return;
 var k=openKey, el=$('qb_'+cssk(k));
 var n=parseInt(el&&el.value,10);
 if(!n||n<1){if(el)el.focus();return;}
 var it=pend[k]||{};
 var cap=capOf(it);
 if(cap&&n>cap){
  el.value='';
  el.placeholder='ख़रीद कुल '+cap+' — ज़्यादा "बिना बिल" से';
  el.focus();return;
 }
 var up=(it.unit_net_p!=null?it.unit_net_p:it.unit_p)||0;
 cart.push({key:k,item_key:it.item_key||null,item_name:it.item_name||String(k),
  units:n,unit_p:it.unit_p||0,unit_net_p:up,amount_p:up*n,cap:cap,
  pack_n:it.pack_n||null,mrp_p:it.unit_p||0,condition:'sealed'});
 openKey=null;
 redraw();
}

function conv(c){
 var w=unitWord(c.item_name);
 if(!c.pack_n||c.units<c.pack_n)return c.units+' '+w;
 var s=Math.floor(c.units/c.pack_n), l=c.units%c.pack_n;
 return c.units+' '+w+' = '+s+' पत्ता'+(l?(' + '+l+' '+w):'');
}
function drawCart(){
 $('cart').innerHTML=cart.map(function(c,i){
  return '<div class="cartline">'
   +'<div class="row"><b>'+c.item_name+'</b>'
   +'<button class="ghost" style="padding:5px 11px" onclick="rm('+i+')">✕</button></div>'
   +'<div class="row" style="margin-top:7px"><div class="qty">'
   +'<button onclick="qd('+i+',-1)">−</button>'
   +'<input type="number" inputmode="numeric" value="'+c.units+'" data-prev="'+c.units+'"'
   +' onfocus="this.dataset.prev=this.value;this.value=\'\'"'
   +' onblur="if(this.value===\'\')this.value=this.dataset.prev"'
   +' onchange="qset('+i+',this.value)"><button onclick="qd('+i+',1)">+</button></div>'
   +'<button class="cond'+(c.condition!=='sealed'?' bad':'')+'" onclick="cond('+i+')">'
   +(c.condition==='sealed'?'सील बंद ✔':'खुला/ख़राब')+'</button></div>'
   +'<div class="row" style="margin-top:5px"><span class="dim">'+conv(c)
   +(c.mrp_p&&c.unit_net_p<c.mrp_p?(' · MRP '+rupee(c.mrp_p*c.units)+' → net'):'')+'</span>'
   +'<span>'+(c.condition!=='sealed'?'<span class="redtxt">वापसी नहीं होगी</span>':rupee(c.amount_p))
   +'</span></div></div>';}).join('')
  ||'<div class="dim">कोई दवा नहीं चुनी</div>';
 var tot=netTotal();
 $('tot').textContent=rupee(tot); drawBar();
}
function netTotal(){
 var t=0;for(var i=0;i<cart.length;i++)if(cart[i].condition==='sealed')t+=cart[i].amount_p;
 return t;
}
function rm(i){cart.splice(i,1);drawCart();}
function qd(i,d){var c=cart[i];c.units=Math.max(1,c.units+d);if(c.cap&&c.units>c.cap)c.units=c.cap;
 c.amount_p=(c.unit_net_p||c.unit_p)*c.units;drawCart();}
function qset(i,v){var c=cart[i];c.units=Math.max(1,parseInt(v,10)||1);if(c.cap&&c.units>c.cap)c.units=c.cap;
 c.amount_p=(c.unit_net_p||c.unit_p)*c.units;drawCart();}
function cond(i){cart[i].condition=cart[i].condition==='sealed'?'opened':'sealed';drawCart();}

function drawBar(){
 var n=cart.length;
 if(step===1||n===0){$('bar').classList.add('hide');return;}
 $('bar').classList.remove('hide');
 $('barTxt').textContent=n+' दवाएँ · net '+rupee(netTotal());
 $('barBtn').textContent=(step===2)?'पर्ची बनाएँ →':'✔ पक्का करें और प्रिंट';
}
function barGo(){
 if(step===2){$('st3').disabled=false;drawCart();go(3);}
 else save();
}
function save(){
 if(!cart.length)return;
 $('ov').classList.remove('hide');
 var body={patient_ref_id:patient?patient.id:null,
  patient_label:patient?((patient.name||'')+(patient.clinic_id?(' · '+patient.clinic_id):'')):'बिना रिकॉर्ड',
  lines:cart.map(function(c){return {item_key:c.item_key,item_name:c.item_name,
   units:c.units,unit_p:c.unit_net_p||c.unit_p,amount_p:c.amount_p,condition:c.condition};}),
  closure:'nothing'};
 fetch(API+'/slip',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(body)})
 .then(function(r){return r.json();})
 .then(function(j){
  $('ov').classList.add('hide');
  if(!j.ok){$('msg').textContent='रुका: '+(j.message||j.error);return;}
  printSlip(j,body); resetAll();
 })
 .catch(function(){$('ov').classList.add('hide');
  $('msg').textContent='सर्वर से जवाब नहीं — दोबारा दबाएँ';});
}

function printSlip(j,body){
 var rows=j.lines.map(function(l){
  return '<tr><td>'+l.item_name+'<br><span style="font-size:11px">'
   +(l.bills?('बिल: '+l.bills):'')+'</span></td>'
   +'<td>'+(l.qty_text||l.qty_units)+'</td>'
   +'<td>'+(l.accepted?rupee(l.amount_p):'—')+'</td>'
   +'<td>'+(l.accepted?'ली गई ✔':('नहीं ली — '+(HI[(l.reasons||[])[0]]||'')))+'</td></tr>';}).join('');
 $('printArea').innerHTML='<h2>Sanjeevni Medicos — वापसी पर्ची</h2>'
  +'<p>पर्ची <b>'+j.slip_no+'</b> · '+j.business_date+' · स्टाफ: '+j.staff+'<br>'
  +'मरीज: '+(body.patient_label||'')+'</p>'
  +'<table><tr><th>दवा</th><th>मात्रा</th><th>रक़म</th><th>फ़ैसला</th></tr>'+rows+'</table>'
  +'<p><b>कुल वापसी: '+rupee(j.refund_p)+'</b></p>'
  +'<p style="border:1px solid #444;padding:4px 6px"><b>यह पर्ची medical sales counter पर दिखाएँ</b> —'
  +' रक़म वहाँ नक़द मिलेगी या नई ख़रीद में adjust होगी।</p>'
  +'<div class="foot">'+POLICY+'</div>';
 window.print();
}

var VOID_HI={matra_galat:'मात्रा ग़लत',dawa_galat:'दवा ग़लत',raqam_galat:'रक़म ग़लत',
 irada_badla:'मरीज ने इरादा बदला',anya:'अन्य'};
function slipRow(s){
 var st = s.status==='void' ? '<span class="redtxt">Cancel हुई</span>'
  : s.settle_state==='cash' ? 'नक़द ✔ ('+(s.cash_paid_by||'')+')'
  : s.settle_state==='adjust' ? 'Adjust ✔ बिल '+(s.adjust_bill_no||'')
  : '<span style="color:var(--teal)">निपटान बाक़ी</span>';
 var acts='';
 if(s.status!=='void'&&s.settle_state==='pending'){
  acts='<div class="row" style="margin-top:6px;gap:6px">'
   +'<button class="ghost" style="flex:1;padding:7px" onclick="askForm(\''+s.slip_no+'\',\'cash\')">💵 नक़द</button>'
   +'<button class="ghost" style="flex:1;padding:7px" onclick="askForm(\''+s.slip_no+'\',\'adjust\')">🧾 Adjust</button>'
   +'<button class="ghost" style="flex:1;padding:7px;color:#ff9d8f;border-color:#c0392b"'
   +' onclick="askForm(\''+s.slip_no+'\',\'void\')">Cancel करें</button></div>';
  if(openForm&&openForm.slip===s.slip_no)acts+=formHtml(s.slip_no,openForm.kind);
 }
 return '<div class="cartline"><div class="row"><span><b>'+s.slip_no+'</b>'
  +'<br><span class="dim">'+(s.patient_label||'')+' · '+s.staff+' · '+st+'</span></span>'
  +'<span>'+rupee(s.refund_p)+'</span></div>'+acts+'</div>';
}
var openForm=null;   // {slip,kind}
function askForm(no,kind){openForm={slip:no,kind:kind};loadSlips();}
function formHtml(no,kind){
 if(kind==='cash')return '<div class="row" style="margin-top:6px;gap:6px">'
  +'<select id="fv" style="flex:1"><option value="">किसने दिया — चुनें</option>'
  +'<option>alisha</option><option>shivani</option><option>darpan</option>'
  +'<option>shavez</option><option>manoj</option></select>'
  +'<button class="ghost" onclick="doSettle(\''+no+'\',\'cash\')">✔</button>'
  +'<button class="ghost" onclick="openForm=null;loadSlips()">✕</button></div>';
 if(kind==='adjust')return '<div class="row" style="margin-top:6px;gap:6px">'
  +'<input id="fv" placeholder="नए बिल का नंबर (Marg)" style="flex:1">'
  +'<button class="ghost" onclick="doSettle(\''+no+'\',\'adjust\')">✔</button>'
  +'<button class="ghost" onclick="openForm=null;loadSlips()">✕</button></div>';
 return '<div class="row" style="margin-top:6px;gap:6px">'
  +'<select id="fv" style="flex:1"><option value="">Cancel की वजह — चुनें</option>'
  +Object.keys(VOID_HI).map(function(k){return '<option value="'+k+'">'+VOID_HI[k]+'</option>';}).join('')
  +'</select>'
  +'<button class="ghost" style="color:#ff9d8f;border-color:#c0392b" onclick="doVoid(\''+no+'\')">✔</button>'
  +'<button class="ghost" onclick="openForm=null;loadSlips()">✕</button></div>';
}
function doSettle(no,how){
 var v=($('fv').value||'').trim();
 if(!v){$('fv').focus();return;}
 var body={slip_no:no,how:how};
 if(how==='cash')body.cash_paid_by=v.toLowerCase();else body.adjust_bill_no=v;
 fetch(API+'/slip/settle',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(body)}).then(function(r){return r.json();})
 .then(function(j){if(!j.ok)alert('रुका: '+(j.message||j.error));openForm=null;loadSlips();});
}
function doVoid(no){
 var v=$('fv').value;
 if(!v){$('fv').focus();return;}
 var body={slip_no:no,reason:v};
 fetch(API+'/slip/void',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(body)}).then(function(r){return r.json();})
 .then(function(j){if(!j.ok)alert('रुका: '+(j.message||j.error));openForm=null;loadSlips();});
}
function loadSlips(){
 fetch(API+'/slips').then(function(r){return r.json();})
 .then(function(j){
  $('todaySlips').innerHTML=(j.slips||[]).map(slipRow).join('')||'—';
 }).catch(function(){});
}
loadSlips();
</script>
</body>
</html>
