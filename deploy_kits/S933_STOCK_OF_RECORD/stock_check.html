<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock check — Marg against the shelf</title>
<!-- stock_check.html · kit S930_STOCK_CHECK_PAGE · Session 503 (Sanjeevni) · 22-Nov-2026 · the owner's mock-up v5 (D1037). English, PC first, no dialogs. -->
<style>
body{margin:0;background:#f6f7f9;color:#1d2430;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:#1d4f91}a:hover{color:#123366}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 48px}
h1{font-size:23px;margin:0 0 4px} h2{font-size:17px;margin:0 0 4px}
.mute{color:#5f6672} .small{font-size:12px;color:#5f6672}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.top a.back{font-size:13px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:10px;padding:14px 16px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:8px 12px;text-decoration:none;color:#1d2430;min-height:44px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
.chip b{font-size:18px} .chip.red{border-color:#f0b4ae;background:#fdecea} .chip.blue{background:#eaf1fc;border-color:#c5d6f2} .chip.green{background:#e9f6ee;border-color:#bfe3cc}
.box{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin-top:8px} th{text-align:left;font-size:12px;color:#5f6672;font-weight:600;border-bottom:1px solid #e3e6ea;padding:6px 8px}
td{border-bottom:1px solid #eef0f2;padding:7px 8px;vertical-align:top} .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:#1d4f91;font-weight:600} .neg{color:#b42318;font-weight:600} .note{font-size:12px;color:#5f6672}
.cb{font:inherit;font-size:13px;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #1d4f91;background:#eaf1fc;color:#123366;cursor:pointer}
.cb[disabled]{opacity:.6;cursor:default}
details{margin-top:10px} summary{cursor:pointer;color:#1d4f91;min-height:28px}
.cols{columns:3 240px;font-size:13px;margin-top:8px} .cols div{break-inside:avoid;padding:2px 0}
.msg{font-size:12px;color:#1d7a46;margin-left:8px} .msg.err{color:#b42318}
input.q{font:inherit;padding:8px 10px;border:1px solid #c9ced6;border-radius:8px;min-height:44px;box-sizing:border-box;width:18em;max-width:100%}
.sugg{position:absolute;background:#fff;border:1px solid #c9ced6;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.08);z-index:5;max-height:260px;overflow:auto}
.sugg div{padding:8px 12px;cursor:pointer;min-height:36px;box-sizing:border-box}.sugg div:hover{background:#eaf1fc}
.tag{display:inline-block;background:#eef0f2;color:#5f6672;border-radius:6px;padding:1px 7px;font-size:11px;margin-left:6px}
.ev{background:#fff4e0;color:#7a4700}
@media (max-width:640px){.wrap{padding:12px}}
</style></head>
<body><div class="wrap">
<div class="top"><a class="back" href="/finance/approvals">← Sanjeevni Hub</a><span class="small" id="when"></span></div>
<h1>Stock check — Marg against the shelf</h1>
<div class="mute" id="intro">Loading the figures of record…</div>
<div class="chips" id="chips"></div>
<div id="body"></div>
</div>
<script>
var D=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function $(i){return document.getElementById(i);}
function ledger(r){return '/finance/sanjeevni/ledger?k='+encodeURIComponent(r.key||r.item);}
function nm(r,note){return '<td class="nm"><a href="'+ledger(r)+'">'+esc(r.item)+'</a>'+(note?'<div class="note">'+note+'</div>':'')+'</td>';}
function gapCls(g){return g>0?'n pos':(g<0?'n neg':'n');}
function cntBtn(item){return '<td><button class="cb" type="button" data-item="'+esc(item)+'" onclick="countThis(this,this.dataset.item)">Count</button></td>';}
function countThis(btn,item){
  btn.disabled=true;
  fetch('/finance/stockcheck/api/count',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:item})})
   .then(function(r){return r.json();}).then(function(j){var m=document.createElement('span');m.className='msg'+(j.ok?'':' err');m.textContent=j.message||(j.ok?'On his next list.':'Not done.');btn.parentNode.appendChild(m);if(!j.ok)btn.disabled=false;})
   .catch(function(){btn.disabled=false;});
}
function rowNote(r){
  var n=[];
  if(r.evening)n.push('evening count of '+esc(r.base_day?r.base_day.slice(8,10)+'-'+r.base_day.slice(5,7):'')+', the end of its day');
  if(r.named==='below_zero')n.push('the count carried forward went below zero (a purchase not yet in Marg, or a count to redo)');
  if(r.approx)n.push('shares a family figure — approximate');
  if(r.forms&&r.forms.length)n.push('also printed as '+esc(r.forms.join(' / ')));
  if(r.pieces)n.push('pieces');
  if(r.words)n.push(esc(r.words));
  return n.join(' · ');
}
function table(rows,cols){
  var h='<div class="box"><table><thead><tr>'+cols.map(function(c){return '<th'+(c.n?' class="n"':'')+'>'+c.h+'</th>';}).join('')+'<th><span style="position:absolute;left:-9999px">Count</span></th></tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr>'+cols.map(function(c){return c.f(r);}).join('')+cntBtn(r.item)+'</tr>';});
  return h+'</tbody></table></div>';
}
var LOOK=[{h:'Item',f:function(r){return nm(r,rowNote(r));}},{h:'Marg',n:1,f:function(r){return '<td class="n">'+(r.state==='marg_behind'?'behind a bill':esc(r.marg_t))+'</td>';}},
 {h:'Shelf',n:1,f:function(r){return '<td class="n">'+esc(r.core_t)+'</td>';}},{h:'Gap',n:1,f:function(r){return '<td class="'+gapCls(r.gap)+'">'+esc(r.gap_t)+'</td>';}}];
function render(){
  var T=D.totals||{}, R=D.rows||[];
  $('when').innerHTML='read '+esc(D.at.replace('T',' ').slice(0,16))+' IST · the record built '+esc((D.reports&&D.reports.built_at)||'—')+(D.record&&D.record.rebuilding?' · <b>being rebuilt now</b> — read again in a minute':'')+(D.cached?' · <a href="/finance/stockcheck/?fresh=1">read again</a>':'');
  $('intro').innerHTML="Marg's closing of <b>"+esc(D.reports.closing_as_on)+"</b> (the report taken "+esc(D.reports.closing_at)+(D.reports.kind_word?', '+esc(D.reports.kind_word):'')+", plus the bills Amir keyed after it and the sales since) against the shelf figure: the last count, carried forward through Marg's sales, purchases and vouchers. Deliveries count by the scanned bill's quantity, never by reception's tap"+(D.bill_over_tap?'':' <span class="tag">switched off</span>')+"; a tap above the bill is a short supply, back on that dealer's next order. A count saved at or after "+esc(D.evening_hour)+":00 stands for the end of its day. Quantities in strips:tabs; pieces for orthotics, gels and sachets. A name opens its item ledger.";
  $('chips').innerHTML='<a class="chip blue" href="#counts"><b>'+T.counts+'</b>Darpan\'s counts, 30 days</a><a class="chip red" href="#look"><b>'+T.look+'</b>need a look</a>'
   +'<a class="chip blue" href="#arrived"><b>'+T.arrived+'</b>deliveries waiting for Marg</a><a class="chip" href="#noshelf"><b>'+T.noshelf+'</b>no shelf figure yet</a>'
   +(T.count_only?'<a class="chip" href="#countonly"><b>'+T.count_only+'</b>count names Marg no longer prints</a>':'')+'<a class="chip green" href="#agree"><b>'+T.agree+'</b>agree</a>';
  var h='';
  // Darpan's counts
  h+='<div class="card" id="counts" style="border-color:#c5d6f2"><h2>Darpan\'s counts — every one reaches you</h2>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px;position:relative"><label for="cnt" style="font-weight:600">Count this — any item, at the head of Darpan\'s next list:</label>'
    +'<span style="position:relative"><input id="cnt" class="q" placeholder="Type 2 or more letters" autocomplete="off" oninput="sugg(this.value)"><div class="sugg" id="sugg" hidden></div></span>'
    +'<button class="cb" type="button" onclick="countThis(this,$(\'cnt\').value)">Count this</button><span class="note">Every row on this page also carries its own Count button.</span></div>';
  if(D.asks&&D.asks.length) h+='<div class="note" style="margin-bottom:4px">Waiting for his next list: '+D.asks.map(function(a){return '<b>'+esc(a.item)+'</b> (asked '+esc(a.at)+')';}).join(' · ')+'</div>';
  if(D.next_list&&D.next_list.length) h+='<div class="note" style="margin-bottom:4px">Next list ('+esc(D.next_day)+'): '+D.next_list.map(function(x){return esc(x.item)+(x.reason?' <span class="tag">'+esc(x.reason)+'</span>':'');}).join(' · ')+'</div>';
  h+='<div class="mute">Each count shows here the moment he saves it, and as one line on your Hub\'s Needs-you. "Judged against" is the shelf figure for a counted item, Marg\'s figure for an uncounted one.</div>';
  var C=D.counts||[];
  if(C.length){
    h+='<div class="box"><table><thead><tr><th>Day</th><th>Item</th><th class="n">He counted</th><th class="n">Judged against</th><th class="n">Gap</th><th>Note</th><th><span style="position:absolute;left:-9999px">Count</span></th></tr></thead><tbody>';
    C.forEach(function(c){var n=[];if(c.asked)n.push('you asked');else if(c.reason)n.push(esc(c.reason));if(c.evening)n.push('<span class="tag ev">evening count — the end of its day</span>');if(c.provisional)n.push('provisional: a delivery waits for Marg');if(c.basis==='approx')n.push('a family figure — not judged');if(c.note)n.push(esc(c.note));if(c.by&&c.by!=='Darpan')n.push('by '+esc(c.by));
      h+='<tr><td>'+esc(c.day)+' '+esc(c.time)+'</td>'+nm(c,'')+'<td class="n">'+esc(c.qty_t)+'</td><td class="n">'+esc(c.expected_t)+'</td><td class="'+gapCls(c.gap)+'">'+esc(c.gap_t)+'</td><td class="note">'+n.join(' · ')+'</td>'+cntBtn(c.item)+'</tr>';});
    h+='</tbody></table></div>';
  } else h+='<div class="mute" style="margin-top:8px">No spot count in the last 30 days.</div>';
  if(D.older_counts) h+='<div class="note" style="margin-top:6px">'+D.older_counts+' older counts are on the item ledgers.</div>';
  h+='</div>';
  // need a look
  var look=R.filter(function(r){return (r.state==='look'||r.state==='waiting')&&r.gap!==null&&r.gap!==0;});
  var behind=R.filter(function(r){return r.state==='marg_behind';}), cons=R.filter(function(r){return r.state==='consumable';});
  var ortho=look.filter(function(r){return r.ortho;}), meds=look.filter(function(r){return !r.ortho;});
  var big=meds.filter(function(r){return Math.abs(r.gap)>=(r.pack||1);}), small=meds.filter(function(r){return Math.abs(r.gap)<(r.pack||1);});
  h+='<div class="card" id="look"><h2>Need a look — the shelf and Marg differ, and no delivery explains it</h2><div class="mute">Biggest first. A gap with + means the shelf has more than Marg; − means less. The shelf column is the last count carried forward alone; a delivery waiting for Marg is in the table below, never here.</div>';
  h+=big.length?table(big,LOOK):'<div class="mute" style="margin-top:8px">No medicine differs by a strip or more.</div>';
  if(small.length) h+='<details><summary>'+small.length+' more, under one strip each</summary>'+table(small,LOOK)+'</details>';
  if(ortho.length) h+='<details><summary>'+ortho.length+' orthotics — each once, under its Marg name</summary>'+table(ortho,LOOK)+'</details>';
  h+='</div>';
  // Marg's figure behind a bill
  if(behind.length){h+='<div class="card" id="behind"><h2>'+behind.length+' items where Marg\'s figure is behind a bill</h2><div class="mute">Marg\'s figure would go below zero: a bill Marg holds is not in the record yet, or a bill is not keyed. No gap is judged until the purchase side is settled.</div>'+table(behind,LOOK)+'</div>';}
  // the clinic's consumables
  if(cons.length){h+='<div class="card" id="cons"><h2>'+cons.length+' clinic consumables</h2><div class="mute">Used by the clinic without sale bills (your consumption list): shown, never judged as a shop difference.</div><details><summary>Show them</summary>'+table(cons,LOOK)+'</details></div>';}
  // deliveries waiting
  var arr=R.filter(function(r){return r.arrived;});
  h+='<div class="card" id="arrived"><h2>'+arr.length+' deliveries waiting for Marg</h2><div class="mute">A delivery waiting for Amir is not a difference: it lands on the shelf and, once he enters the bill, in Marg — the same amount on both sides. The <b>real difference</b> is the last count carried forward against Marg, the delivery left out of both. Each delivery counts by its scanned bill; a tap above the bill is a short supply, back on that dealer\'s next order.</div>';
  if(arr.length){
    h+='<div class="box"><table><thead><tr><th>Item</th><th class="n">Marg</th><th class="n">Waiting (by the bill)</th><th>From</th><th>Reception\'s tap / the bill</th><th class="n">Real difference</th><th><span style="position:absolute;left:-9999px">Count</span></th></tr></thead><tbody>';
    arr.forEach(function(r){var L=r.lines||[];
      h+='<tr>'+nm(r,rowNote(r))+'<td class="n">'+esc(r.marg_t)+'</td><td class="n">'+esc(r.arrived_t)+'</td><td>'+L.map(function(l){return esc(l.vendor)+(l.stamp?' '+esc(l.stamp):'')+' · '+esc(l.at.slice(8,10)+'-'+l.at.slice(5,7));}).join('<br>')+'</td>'
        +'<td class="note">'+L.map(function(l){return (l.short<0?'<b>'+esc(l.word)+'</b>':esc(l.word));}).join('<br>')+'</td><td class="'+gapCls(r.gap)+'">'+esc(r.gap_t)+'</td>'+cntBtn(r.item)+'</tr>';});
    h+='</tbody></table></div>';
  } else h+='<div class="mute" style="margin-top:8px">Nothing waiting: every arrival is in Marg.</div>';
  h+='</div>';
  // no shelf figure
  var ns=R.filter(function(r){return r.shelf===null;});
  h+='<div class="card" id="noshelf"><h2>'+ns.length+' items Marg holds with no shelf figure yet</h2><div class="mute">New since the last full count, or renamed in Marg. They get a shelf figure at their next count — a Count button puts any of them on Darpan\'s list.</div>';
  if(ns.length) h+='<details><summary>Show the items</summary><div class="cols">'+ns.map(function(r){return '<div><a href="'+ledger(r)+'">'+esc(r.item)+'</a> '+esc(r.marg_t)+' <button class="cb" type="button" style="min-height:28px;padding:0 8px;font-size:12px" data-item="'+esc(r.item)+'" onclick="countThis(this,this.dataset.item)">Count</button></div>';}).join('')+'</div></details>';
  h+='</div>';
  // count names Marg no longer prints
  if(D.count_only&&D.count_only.length){
    h+='<div class="card" id="countonly"><h2>'+D.count_only.length+' count names Marg no longer prints</h2><div class="mute">Counted under a spelling Marg has since changed, and not yet linked to the new name. The identity question (one medicine under two names?) is on your purchase flow page and the Marg watch; once answered, the count reads under the Marg name here.</div>';
    h+='<div class="cols">'+D.count_only.map(function(c){return '<div>'+esc(c.item)+' <span class="note">counted '+esc(c.counted_t)+' on '+esc(c.day)+'</span></div>';}).join('')+'</div></div>';
  }
  // agree
  var ag=R.filter(function(r){return r.gap===0&&(r.state==='agree'||r.state==='waiting');}), agIn=ag.filter(function(r){return r.marg>0;});
  h+='<div class="card" id="agree"><h2>'+ag.length+' items agree</h2><div class="mute">'+agIn.length+' are in stock; the other '+(ag.length-agIn.length)+' are at zero in both and are counted here, never listed.</div>';
  if(agIn.length) h+='<details><summary>Show the '+agIn.length+' in stock</summary><div class="cols">'+agIn.map(function(r){return '<div><a href="'+ledger(r)+'">'+esc(r.item)+'</a> '+esc(r.marg_t)+'</div>';}).join('')+'</div></details>';
  h+='</div>';
  // reports
  h+='<div class="card"><h2>Reports behind this page</h2><div>Marg\'s closing stock: printed as on '+esc(D.reports.closing_printed)+', taken '+esc(D.reports.closing_at)+' — '+esc(D.reports.kind_word||'')+' · Sale report: to '+esc(D.reports.sale_to||'—')+' · Purchases in Marg: to '+esc(D.reports.purchase_to||'—')+'</div>'
    +'<div class="mute" style="margin-top:4px">Every figure here is the stock of record (built '+esc(D.reports.built_at||'—')+'), the one record every page reads: Marg\'s newest report, the bills keyed after it, the sales since, the last count carried forward, the deliveries waiting. '+(D.totals&&D.totals.late?D.totals.late+' items carry a bill keyed after the print. ':'')+'The old Stock drift and Stock now addresses open this page.</div></div>';
  $('body').innerHTML=h;
}
var ST=null;
function sugg(v){clearTimeout(ST);var b=$('sugg');if(!v||v.length<2){b.hidden=true;return;}
  ST=setTimeout(function(){fetch('/finance/stockcheck/api/find?q='+encodeURIComponent(v)).then(function(r){return r.json();}).then(function(j){var it=j.items||[];if(!it.length){b.hidden=true;return;}
   b.innerHTML=it.map(function(n){return '<div data-n="'+esc(n)+'" onclick="pick(this.dataset.n)">'+esc(n)+'</div>';}).join('');b.hidden=false;});},180);}
function pick(n){$('cnt').value=n;$('sugg').hidden=true;}
document.addEventListener('click',function(e){var b=$('sugg');if(b&&!b.hidden&&e.target.id!=='cnt')b.hidden=true;});
fetch('/finance/stockcheck/api/rows'+(location.search.indexOf('fresh=1')>=0?'?fresh=1':'')).then(function(r){return r.json();}).then(function(j){D=j;if(!j.ok){$('intro').textContent=j.reason||'The figures could not be read.';return;}render();})
 .catch(function(){$('intro').textContent='The figures could not be read just now. Reload in a minute.';});
</script></body></html>
