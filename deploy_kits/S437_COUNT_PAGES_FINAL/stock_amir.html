<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock check — Amir ka kaam</title>
<style>
/* S436 STAFF PAGES CLEAN (D638, 28-Sep-2026): ONE screen, Hindi, four sections -- the vouchers, the closing stock after them, the
   corrections, the rest. S437 COUNT PAGES FINAL (F-659, 28-Sep-2026) -- the owner: "He simply requires the voucher details: the product
   name and the quantity he needs to post in that stock issue or receive voucher; other details are not relevant. Instead of rounds, write
   Stock issue voucher number one, two, three." So section 1 is the vouchers ONLY, numbered as Amir keys them -- STOCK ISSUE वाउचर 1..N,
   then STOCK RECEIVE वाउचर 1..M, continuously across the whole count (the server numbers them; the internal round numbers never show
   here) -- and a voucher line is item (packing) · Marg से → तक · कितना, nothing else. A keyed voucher folds to one line with its Marg
   number. Naam badlo shows only after the proof is green (Marg = shelf reached); until then one line and no names.
     1  वाउचर — Marg में डालने हैं       STOCK ISSUE वाउचर 1..N, STOCK RECEIVE वाउचर 1..M; one tap "Marg में डाल दिया" with Marg's voucher number
     2  वाउचर के बाद — closing stock     the one instruction, the proof's confirmation when the next export lands, the upload box as fallback
     3  सुधार — Marg में ठीक करना है     Salt theek karo · Rate daalo · Naam badlo (only when Marg = shelf is proven)
     4  बाकी काम                          anything the system still needs from him (the S428 lines: bill entry baaki, sudhaar, the Sunday)
   Every figure and every quantity word comes from /finance/stock/api/pad/amir/<count>; nothing is computed here. */
:root{
  --ground:#F6F8F7;--surface:#FFF;--surface-2:#EDF2F0;--ink:#15201E;--ink-2:#3D4B48;--muted:#66756F;--line:#D9E2DF;
  --accent:#0E5C58;--on-accent:#FFF;--accent-soft:#D8E9E6;--ok:#0E5C58;--diff:#8C3A2B;--diff-soft:#F6E3DF;--warn:#8A5A12;--warn-soft:#F7ECD8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1312;--surface:#151D1B;--surface-2:#1B2523;--ink:#E7EEEB;--ink-2:#BCC9C5;--muted:#869892;--line:#26332F;
  --accent:#63C2B6;--on-accent:#0D1312;--accent-soft:#17322F;--ok:#63C2B6;--diff:#E08A76;--diff-soft:#33201C;--warn:#D3A052;--warn-soft:#2E2617;
}}
:root[data-theme="dark"]{
  --ground:#0D1312;--surface:#151D1B;--surface-2:#1B2523;--ink:#E7EEEB;--ink-2:#BCC9C5;--muted:#869892;--line:#26332F;
  --accent:#63C2B6;--on-accent:#0D1312;--accent-soft:#17322F;--ok:#63C2B6;--diff:#E08A76;--diff-soft:#33201C;--warn:#D3A052;--warn-soft:#2E2617;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans","Noto Sans Devanagari",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 40px}
h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card h2{font-size:18px;margin:0 0 4px}.card .n{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:13px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:700;margin-right:8px}
.lead{color:var(--ink-2);font-size:14.5px;margin:6px 0 10px}
.empty{color:var(--muted);font-style:italic;font-size:14px;padding:4px 0}
.vc{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--surface)}
.vc.issue{border-left:5px solid var(--diff)}.vc.receive{border-left:5px solid var(--ok)}
.vc .vh{font-weight:700;font-size:17px}.vc .vs{color:var(--muted);font-size:13px}
details.vd{border:1.5px dashed var(--line);border-radius:12px;margin:8px 0;background:var(--surface);opacity:.75}
details.vd>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;min-height:44px}
details.vd>summary::-webkit-details-marker{display:none}
details.vd>.in{padding:0 14px 10px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-top:1px dashed var(--line);font-size:15px}
.ln:first-of-type{border-top:0}
.ln .it{font-weight:700}.ln .q{color:var(--ink-2);font-size:13.5px}.ln .r{text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.ln .r.out{color:var(--diff)}.ln .r.inn{color:var(--ok)}
.ent{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.ent input{font:inherit;font-size:16px;padding:9px;border:1px solid var(--line);border-radius:9px;flex:1;min-width:150px;background:var(--surface);color:var(--ink)}
button.b{font:inherit;font-size:15px;font-weight:700;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px}
button.b.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tg{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;font-weight:600}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row .it{font-weight:700}.row .q{color:var(--ink-2);font-size:13.5px}.row .r{text-align:right;white-space:nowrap;font-weight:700}
.row.done{opacity:.55}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.warn{color:var(--warn);border-color:var(--warn)}.chip.bad{color:var(--diff);border-color:var(--diff)}
.msg{font-size:14px;color:var(--ok);margin-top:6px;font-weight:600;min-height:18px}.err{color:var(--diff);font-weight:700}
.margbox{margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}.margbox input{display:block;width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);margin-top:6px}
h3{font-size:15.5px;margin:12px 0 4px}
.copy{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:var(--surface-2);border-radius:6px;padding:2px 6px}
.tally{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin:4px 0 8px}.tally b{color:var(--ink)}
</style></head><body><div class="wrap">
<div class="top"><h1>Stock check — Amir ka kaam</h1><span class="sub" id="who"></span></div>
<div class="sub">वाउचर · closing stock · सुधार · बाकी काम — सब एक ही पन्ने पर</div>
<div id="body"><div class="card"><span class="sub">Loading…</span></div></div>
</div>
<script>
/*__BOOT__*/
const BASE="/finance/stock";
const B=window.BOOT||{count_id:0,user:"",checker:false};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
let D=null;
function load(){
  fetch(BASE+"/api/pad/amir/"+B.count_id,{cache:"no-store"}).then(r=>r.json()).then(j=>{ if(!j.ok){ document.getElementById("body").innerHTML='<div class="card err">'+esc(j.message||"ginti nahi mili")+'</div>'; return; } D=j; render(); })
  .catch(()=>{ document.getElementById("body").innerHTML='<div class="card err">Server ne jawab nahi diya. Internet dekh kar phir kholiye.</div>'; });
}
function vtitle(v){ return (v.kind==="ISSUE"?"STOCK ISSUE":"STOCK RECEIVE")+" — वाउचर "+v.seq; }
function vkey(v){ return v.round_no+'|'+v.kind+'|'+v.batch_no; }
function lineHtml(l){
  // S437: item (packing) · Marg से → तक · कितना -- and nothing else; every word from the server (qty_words, the whole-piece list included)
  return '<div class="ln"><div><div class="it">'+esc(l.item)+(l.packing?' <span class="sub">('+esc(l.packing)+')</span>':'')+'</div><div class="q">Marg से '+esc(l.from_hi)+' → तक '+esc(l.to_hi)+'</div></div>'
    +'<div class="r '+(l.change<0?'out':'inn')+'">'+(l.change<0?"− ":"+ ")+esc(l.qty_hi)+'</div></div>';
}
function voucherCard(v){
  const k=vkey(v);
  if(v.entered){
    return '<details class="vd"><summary><span><b>'+esc(vtitle(v))+'</b> <span class="sub">· '+v.n+' item</span></span><span class="chip ok">✓ Marg नं. '+esc(v.entered.no)+'</span></summary><div class="in">'
      +(v.lines||[]).map(lineHtml).join("")
      +'<div class="vs" style="margin-top:8px">Marg में डला '+(v.entered.on?'('+esc(v.entered.on)+') ':'')+'· '+esc(v.entered.by)+' · '+esc(v.entered.at_text)+' <button class="tg" data-unent="'+esc(k)+'">वापस लें</button></div></div></details>';
  }
  return '<div class="vc '+(v.kind==="ISSUE"?'issue':'receive')+'"><div class="vh">'+esc(vtitle(v))+'</div><div class="vs">'+(v.kind==="ISSUE"?"Marg में कम करना":"Marg में बढ़ाना")+' · '+v.n+' item — Marg में यह एक वाउचर बनाइए</div>'
    +(v.lines||[]).map(lineHtml).join("")
    +'<div class="ent"><input type="text" inputmode="text" placeholder="Marg का वाउचर नंबर" data-vno="'+esc(k)+'"><button class="b main" data-ent="'+esc(k)+'">Marg में डाल दिया</button></div></div>';
}
function render(){
  const d=D;
  document.getElementById("who").textContent="Ginti #"+d.count_id+" · "+(d.day||"")+" · "+(B.user||"");
  let h="";
  // 1 -- the vouchers, numbered as Amir keys them: STOCK ISSUE 1..N, then STOCK RECEIVE 1..M
  const VF=(d.made&&d.made.vouchers_flat)||[];
  const nI=VF.filter(v=>v.kind==="ISSUE").length, nR=VF.length-nI, done=VF.filter(v=>v.entered).length;
  h+='<div class="card" id="vouchers"><h2><span class="n">1</span>वाउचर — Marg में डालने हैं</h2><div class="lead">हर कार्ड Marg में <b>एक</b> वाउचर है (6 line तक)। पहले सब <b>STOCK ISSUE</b> (Marg में कम करना), फिर सब <b>STOCK RECEIVE</b> (Marg में बढ़ाना)। हर line में item, Marg से → तक और कितना — बस इतना डालना है। डालने के बाद Marg का वाउचर नंबर लिखिए और <b>Marg में डाल दिया</b> दबाइए।</div>';
  h+='<div class="tally"><span>STOCK ISSUE <b>'+nI+'</b></span><span>STOCK RECEIVE <b>'+nR+'</b></span><span>डल गए <b>'+done+' / '+VF.length+'</b></span></div>';
  if(!VF.length) h+='<div class="empty">अभी कोई वाउचर नहीं।</div>';
  VF.forEach(v=>{ h+=voucherCard(v); });
  h+='<div class="msg" id="vmsg"></div></div>';
  // 2 -- after the vouchers: the closing stock
  h+='<div class="card"><h2><span class="n">2</span>वाउचर के बाद — Marg से closing stock निकालें</h2><div class="lead">सब वाउचर डल जाने के बाद पूरे स्टोर का closing stock export रोज़ की तरह निकालिए — वह अपने आप server तक पहुँचता है। अगला export आते ही यहाँ पुष्टि आएगी कि Marg और shelf मिल गए या नहीं।</div>'
    +'<div class="row"><div><div class="it">Marg = shelf?</div><div class="q">'+esc(d.proof_hi||"अभी बाकी")+'</div></div><div class="r"><span class="chip'+(d.proof_state==="done"?' ok':' warn')+'">'+(d.proof_state==="done"?"मिल गए ✓":((d.proof_hi||"").startsWith("Marg = shelf")?"आ गया":"अभी बाकी"))+'</span></div></div>'
    +margBox(d)+'</div>';
  // 3 -- corrections in Marg
  h+='<div class="card"><h2><span class="n">3</span>सुधार — Marg में ठीक करना है</h2>';
  const SF=d.salt_fix||[];
  h+='<h3>(a) Salt theek karo</h3><div class="lead">Marg में इन items का salt गलत है — item master में salt बदलिए। अगला salt export आते ही यह अपने आप हट जाएगा।</div>';
  if(!SF.length) h+='<div class="empty">कोई नहीं।</div>';
  SF.forEach(s=>{ h+='<div class="row'+(s.marg_done?' done':'')+'"><div><div class="it">'+esc(s.item)+'</div><div class="q">अभी: '+esc(s.marg_now||s.salt_now||"—")+' → <span class="copy">'+esc(s.salt_new)+'</span></div></div><div class="r"><span class="chip'+(s.marg_done?' ok':' warn')+'">'+esc(s.hi)+'</span></div></div>'; });
  const RT=d.rate_tasks||[];
  h+='<h3>(b) Rate daalo</h3><div class="lead">इन items का selling rate Marg में नहीं है — item master में rate डालिए, तभी इनका हिसाब बनेगा।</div>';
  if(!RT.length) h+='<div class="empty">कोई नहीं।</div>';
  RT.forEach(t=>{ h+='<div class="row"><div><div class="it">'+esc(t.item)+' <span class="sub">'+esc(t.packing||"")+'</span></div><div class="q">'+esc(t.hi)+'</div></div><div class="r"><span class="chip warn">करना है</span></div></div>'; });
  // (c) S437: the renames ONLY after the proof is green -- Marg = shelf proven for this count; until then one line and no names
  const RN=d.renames_ready?((d.renames||{}).rows||[]):[], RS=(d.renames||{}).summary;
  h+='<h3 id="renames">(c) Naam badlo'+(d.renames_ready?' ('+RN.length+')':'')+'</h3>';
  if(!d.renames_ready) h+='<div class="lead">'+esc(d.renames_wait_hi||"नाम बदलना — बाद में, जब Marg और shelf मिल जाएँ")+'</div>';
  else {
    h+='<div class="lead">Marg में इन नामों को ठीक वैसे ही बदलिए जैसा लिखा है (कॉपी कीजिए), फिर टिक कीजिए। Server Marg के अगले stock export से खुद पढ़ लेगा: <b>'+(RS?RS.verified:0)+' of '+RN.length+'</b> दिख गए'+(RS&&RS.amber?' · <span class="err">'+RS.amber+' टिक हुए पर Marg में अभी नहीं दिखे</span>':'')+'।</div>';
    h+=RN.map(r=>'<div class="row'+(r.state==="verified"?' done':'')+'"><div><div class="it">'+esc(r.old_name)+'</div><div class="it" style="color:var(--accent)">→ <span class="copy">'+esc(r.new_name)+'</span></div><div class="q">'+esc(r.state_hi)+(r.done_by?' · '+esc(r.done_by):'')+(r.verified_as_on?' · Marg export '+esc(r.verified_as_on):'')+'</div></div>'
      +'<div class="r">'+(r.state==="planned"?'<button class="b main" data-rtick="'+esc(r.old_name)+'">Marg में बदल दिया</button>':(r.state==="verified"?'✓':'<span class="chip'+(r.state==="amber"?' bad':' ok')+'">'+(r.state==="amber"?'अभी दिखा नहीं':'✓ टिक')+'</span> <button class="tg" data-runtick="'+esc(r.old_name)+'">वापस</button>'))+'</div></div>').join("");
    h+='<div class="msg" id="rmsg"></div>';
  }
  h+='</div>';
  // 4 -- whatever else the system needs from him
  h+='<div class="card"><h2><span class="n">4</span>बाकी काम</h2>'+restCard(d.watch)+'</div>';
  document.getElementById("body").innerHTML=h;
  const hh=location.hash.slice(1); if(!window._s436 && (hh==="vouchers"||hh==="renames")){ window._s436=1; const e=document.getElementById(hh); if(e) e.scrollIntoView(); }
}
function margBox(d){
  return '<div class="margbox" id="margbox"><b>रिपोर्ट यहाँ भी भेज सकते हैं</b><div class="sub">अगर export अपने आप न पहुँचे — कोई भी फ़ाइल (export, PDF, फोटो)। कुछ टाइप नहीं करना।</div>'
    +'<form id="margform"><input type="file" name="file" id="margfile" required><input type="text" name="item" id="margitem" placeholder="Item (ज़रूरी नहीं)"><input type="text" name="note" id="margnote" placeholder="Note (ज़रूरी नहीं)"><button type="submit" class="b main" style="margin-top:8px">Server को भेजो</button></form><div class="msg" id="margmsg"></div>'
    +((d.marg_answers||[]).length?'<div class="sub" style="margin-top:6px">भेजी हुई: '+d.marg_answers.slice(0,4).map(x=>esc(x.orig)+' ('+esc(x.at_text)+')').join(' · ')+'</div>':'')+'</div>';
}
function restCard(W){
  let h=''; let n=0;
  if(W&&W.ok!==false){
    const P=W.plan;
    if(P){ n++; h+='<div class="row"><div><div class="it">पूरी गिनती का Sunday</div><div class="q">'+(P.status==="confirmed"?'Sunday <b>'+esc(P.sunday_text)+'</b> — Darpan ने हाँ कही ✓':(P.status==="picked"?'आपने <b>'+esc(P.sunday_text)+'</b> चुना — Darpan की हाँ बाकी':'गिनती का Sunday चुनिए:'))+'</div>'
      +(P.status!=="confirmed"?'<div style="margin:6px 0">'+(P.window_text||[]).map((t,i)=>'<button class="b'+(P.window[i]===P.sunday?' main':'')+'" data-sunday="'+esc(P.window[i])+'">'+esc(t)+'</button>').join(" ")+'</div><div class="msg" id="wmsg"></div>':'')+'</div><div></div></div>'; }
    (W.bill_pending||[]).forEach(x=>{ n++; h+='<div class="row"><div><div class="it">'+esc(x.item)+'</div><div class="q">'+esc(x.text_hi)+' — माल आ गया, Marg में बिल अभी नहीं</div></div><div class="r"><span class="chip warn">bill entry</span></div></div>'; });
    (W.fixes||[]).forEach(x=>{ n++; h+='<div class="row"><div><div class="it">'+esc(x.item)+'</div><div class="q">'+esc(x.fix)+' · '+esc(x.at_text)+'</div></div><div class="r"><span class="chip warn">सुधार</span></div></div>'; });
  }
  if(!n) h+='<div class="empty">आज कुछ नहीं — सब ऊपर है।</div>';
  return h;
}
document.addEventListener("submit", async e=>{
  if(e.target.id!=="margform") return; e.preventDefault();
  const fd=new FormData(e.target); const m=document.getElementById("margmsg"); m.textContent="भेज रहे हैं…";
  const r=await fetch(D.marg_answer_url,{method:"POST",body:fd}).catch(()=>null); const j=r?await r.json().catch(()=>null):null;
  if(!j||!j.ok){ m.textContent="नहीं गया: "+((j&&j.message)||"server ने जवाब नहीं दिया"); return; }
  m.textContent=j.message; setTimeout(load, 900);
});
document.addEventListener("click", async e=>{
  const sd=e.target.closest("button[data-sunday]"); if(sd){ const m=document.getElementById("wmsg"); if(m) m.textContent="…";
    const r=await fetch(BASE+"/api/watch/plan/pick",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sunday:sd.dataset.sunday})}).catch(()=>null);
    const j=r?await r.json().catch(()=>null):null; if(m) m.textContent=(j&&j.message)||"server ne jawab nahi diya"; if(j&&j.ok) setTimeout(load, 700); return; }
  const en=e.target.closest("button[data-ent],button[data-unent]"); if(en){ const k=(en.dataset.ent||en.dataset.unent).split("|"); const m=document.getElementById("vmsg");
    const inp=en.dataset.ent?document.querySelector('input[data-vno="'+en.dataset.ent+'"]'):null; const no=inp?(inp.value||"").trim():"";
    if(en.dataset.ent&&!no){ m.textContent="पहले Marg का वाउचर नंबर लिखिए।"; if(inp) inp.focus(); return; }
    const r=await fetch(BASE+"/api/pad/vouchers/"+D.count_id+"/entered",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({round:+k[0],kind:k[1],batch:+k[2],marg_voucher_no:no,clear:!!en.dataset.unent})}).catch(()=>null);
    const j=r?await r.json().catch(()=>null):null; m.textContent=(j&&j.ok)?(en.dataset.unent?"वापस ले लिया।":"लिख लिया — वाउचर नं. "+no):((j&&j.message)||"server ne jawab nahi diya"); if(j&&j.ok) setTimeout(load, 700); return; }
  const rk=e.target.closest("button[data-rtick],button[data-runtick]"); if(rk){ const m=document.getElementById("rmsg"); if(m) m.textContent="…";
    const r=await fetch(BASE+"/api/pad/rename/tick",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({old:rk.dataset.rtick||rk.dataset.runtick,clear:!!rk.dataset.runtick})}).catch(()=>null);
    const j=r?await r.json().catch(()=>null):null; if(m) m.textContent=(j&&j.message)||"server ne jawab nahi diya"; if(j&&j.ok) setTimeout(load, 700); return; }
