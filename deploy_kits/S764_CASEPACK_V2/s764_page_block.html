<script>
/* ===== S764 (S418, 09-Nov-2026) — THE ENQUIRY STAGE v2 (D880) ====================================================
   THE OWNER (10:36–13:32 IST 09-Nov, mock-up PNrgan7RNL6Fko4oncFzAs v4): the procedure / bone / code search is the lead control and the
   patient link a quiet line; cash packages, the DTH rates and the estimates given are SAVED ON THE SERVER — the same list on his phone,
   the clinic PC and Shavez's PC; the DTH rates ONE separate editable list, never repeated inside an estimate; general ward and the
   basic (SS) implant the defaults everywhere; "Build an estimate" its own fold-out, blank; EVERY estimate line its own fold that opens
   its heads in place; "Save as a new package" on every estimate, "Save changes to this package" on a quoted one; "Give estimate"
   records it under the patient; the foot bar Next: Consent → · Estimates given · Manage packages; the stepper 1 Estimate → 2 Consent →
   3 OT & orders → 4 IPD case; a template feeds the consent, the OT list and the orders with its bone and operation; his NET at 50% (a
   private setting) — post-discharge revenue never in the case value.
   Every function here is new or wraps a base one by name; the consent, OT list and orders code is not rewritten. localStorage is an
   OFFLINE CACHE only (dma_cp_v2_cache); the server is the list. */
(function(){
var S={pk:null,rates:[],cat:null,settings:null,est:null,folds:{},err:"",loaded:false,rv:0,ratesDirty:false};
var SIZE={small:{anaesthesia:3000,otMeds:2000,wardMeds:1000,lab:"Small · day-care"},medium:{anaesthesia:5000,otMeds:3000,wardMeds:2500,lab:"Medium · 2–3 d"},major:{anaesthesia:6000,otMeds:10000,wardMeds:5000,lab:"Major · 4–5 d"}};
var GRADES=[{k:"eco",n:"Basic (SS)",m:1},{k:"prem",n:"Premium (Ti)",m:1.6},{k:"imp",n:"Imported",m:2.4}];
var RTYPES={ward:"Ward · per day",day:"Every day",opt:"Per day, when ticked"};
var CACHE="dma_cp_v2_cache";
function num(v){var x=Math.round(parseFloat(v));return isNaN(x)?0:Math.max(0,x);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function J(url,opt){return fetch(url,Object.assign({credentials:"same-origin"},opt||{})).then(function(r){return r.json().then(function(j){j._code=r.status;return j;});});}
function POST(url,body){return J(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});}
function gradeOf(k){for(var i=0;i<GRADES.length;i++)if(GRADES[i].k===k)return GRADES[i];return GRADES[0];}
function R(k){for(var i=0;i<S.rates.length;i++)if(S.rates[i].k===k)return S.rates[i];return null;}
function wards(){return S.rates.filter(function(x){return x.t==="ward";});}
function defRoom(){var d=(S.pk&&S.pk.defaults)||{};return (d.room&&R(d.room))?d.room:(wards()[0]||{k:"gen"}).k;}
function defGrade(){var d=(S.pk&&S.pk.defaults)||{};return gradeOf(d.grade||"eco").k;}
/* THE ARITHMETIC — the same formula as casepack_v2.calc on the server; the walk proves the two agree */
window.s764Calc=function(e,rates,share){
 var by={};rates.forEach(function(r){by[r.k]=r;});
 var stay=Math.max(1,num(e.stay)||1), surgery=num(e.surgery), ot=Math.round(surgery*0.2);
 var implant=Math.round(num(e.implant)*gradeOf(e.grade||"eco").m);
 var an=num(e.anaesthesia),otm=num(e.otMeds),wm=num(e.wardMeds),adm=num(e.admission),carm=num(e.carm),inv=num(e.investigations),oth=num(e.other);
 var room=by[e.room||"gen"]||rates.filter(function(r){return r.t==="ward";})[0]||{r:0,n:"General Ward",k:"gen"};
 var roomAmt=num(room.r)*stay, day=0, opt=0, dayL=[], optL=[];
 rates.forEach(function(r){if(r.t==="day"){day+=num(r.r)*stay;dayL.push([r.n+" × "+stay,num(r.r)*stay]);}if(r.t==="opt"&&e.opts&&e.opts[r.k]){opt+=num(r.r)*stay;optL.push([r.n+" × "+stay,num(r.r)*stay]);}});
 var heads=an+otm+wm+adm+carm+inv+oth, total=surgery+ot+heads+roomAmt+day+opt+implant, disc=num(e.discount);
 var netp=Math.max(0,total-disc), shareable=netp-adm-(an+otm+wm+implant+inv), myNet=Math.round(shareable*(num(share)/100));
 var lines=[["Surgery",surgery],["OT charges (20%)",ot]];
 if(carm)lines.push(["Image / C-arm",carm]);if(adm)lines.push(["Admission",adm]);
 lines.push([room.n+" × "+stay+" day"+(stay===1?"":"s"),roomAmt]);dayL.forEach(function(x){lines.push(x);});optL.forEach(function(x){lines.push(x);});
 lines.push(["Implant · "+gradeOf(e.grade||"eco").n,implant]);
 if(an)lines.push(["Anaesthesia",an]);if(otm)lines.push(["OT medicines",otm]);if(wm)lines.push(["Ward medicines",wm]);if(inv)lines.push(["Investigations",inv]);if(oth)lines.push(["Other",oth]);
 if(disc)lines.push(["Discount",-disc]);
 return {surgery:surgery,ot:ot,implant:implant,heads:heads,room:roomAmt,roomName:room.n,day:day,opt:opt,stayAll:roomAmt+day+opt,stay:stay,total:total,discount:disc,net_to_patient:netp,shareable:shareable,my_net:myNet,lines:lines};
};
function calc(e){return window.s764Calc(e,S.rates,S.settings?S.settings.share_pct:0);}
function rs(n){return rupee(n);}
/* ---- estimate objects ---- */
function fromPkg(p){var e={src:p.id,template:p.template||null,title:p.name,surgery:p.surgery,implant:p.implant,grade:defGrade(),stay:p.stay,room:defRoom(),opts:{},anaesthesia:p.anaesthesia,otMeds:p.otMeds,wardMeds:p.wardMeds,admission:p.admission,carm:p.carm,investigations:p.investigations,other:p.other||0,discount:0,size:p.size||null,sb:p.sb,sb_note:p.sb_note,consent_k:p.consent_k,c_part:p.c_part,c_bone:p.c_bone,ot_proc:p.ot_proc,tpa_q:p.tpa_q,fx:p.fx,fix:p.fix};return e;}
function blank(t){var d=(S.pk&&S.pk.defaults)||{};var sz=t?(t.suggest.size||"medium"):"medium";var z=SIZE[sz];
 return {src:null,template:t?t.id:null,title:t?(t.fx+" — "+t.fix):"New estimate",surgery:"",implant:"",grade:defGrade(),stay:t?t.suggest.stay:2,room:defRoom(),opts:{},anaesthesia:z.anaesthesia,otMeds:z.otMeds,wardMeds:z.wardMeds,admission:num(d.admission!=null?d.admission:1200),carm:num(d.carm!=null?d.carm:4000),investigations:num(d.investigations!=null?d.investigations:2000),other:0,discount:0,size:sz,
  sb:t?t.sb:null,sb_note:t?t.sb_note:null,consent_k:t?t.consent_k:null,c_part:t?t.c_part:null,c_bone:t?t.c_bone:null,ot_proc:t?t.ot_proc:null,tpa_q:t?t.tpa_q:null,fx:t?t.fx:null,fix:t?t.fix:null};}
function pkgCalc(p){return calc(fromPkg(p));}
function ayRate(sb){try{for(var i=0;i<BUNDLE.ayush.length;i++){if(BUNDLE.ayush[i].sub===sb)return BUNDLE.ayush[i].rate||0;}}catch(_e){}return 0;}
/* ---- load: the server first, the cache when it cannot answer ---- */
function cacheWrite(){try{localStorage.setItem(CACHE,JSON.stringify({pk:S.pk,rates:S.rates,rv:S.rv,cat:S.cat,settings:S.settings,at:Date.now()}));}catch(_e){}}
function cacheRead(){try{var c=JSON.parse(localStorage.getItem(CACHE)||"null");if(c&&c.pk){S.pk=c.pk;S.rates=c.rates||[];S.rv=c.rv||0;S.cat=c.cat;S.settings=c.settings||null;return true;}}catch(_e){}return false;}
window.s764Load=function(){
 S.err="";
 return Promise.all([J("/portal/casepack/packages"),J("/portal/casepack/rates"),J("/portal/casepack/templates")]).then(function(a){
  if(!a[0].ok||!a[1].ok)throw new Error((a[0].error||a[1].error||"the server did not answer"));
  S.pk={version:a[0].version,saved_at:a[0].saved_at,defaults:a[0].defaults,groups:a[0].groups,packages:a[0].packages};S.settings=a[0].settings||null;   /* null = not the owner's login: no net is shown */
  S.rates=a[1].rates||[];S.rv=a[1].version;S.ratesDirty=false;S.cat=a[2].ok?a[2]:null;S.loaded=true;cacheWrite();
  if(S.est&&S.est.src){var p=pkgById(S.est.src);if(!p)S.est=null;}
  render();
 }).catch(function(e){
  var had=cacheRead();S.loaded=had;S.err=(had?"Showing the copy saved on this device — the server did not answer (":"The server did not answer (")+(e&&e.message||e)+").";render();
 });
};
function pkgById(id){var ps=(S.pk&&S.pk.packages)||[];for(var i=0;i<ps.length;i++)if(ps[i].id===id)return ps[i];return null;}
/* ---- search ---- */
function qstr(){return ((state.q||"")+" "+(state.chip||"")).trim().toLowerCase();}
function hit(h){var q=qstr();if(!q)return true;h=String(h||"").toLowerCase();return q.split(/\s+/).every(function(t){return h.indexOf(t)>=0||(t.length>3&&t.slice(-1)==="s"&&h.indexOf(t.slice(0,-1))>=0);});}
/* ---- rendering: the cash pane ---- */
function ratesHTML(){
 var h="";["ward","day","opt"].forEach(function(t){h+='<span class="grp">'+RTYPES[t]+'</span>';S.rates.forEach(function(x,i){if(x.t!==t)return;
  h+='<select data-ri="'+i+'" data-f="t">'+Object.keys(RTYPES).map(function(tt){return '<option value="'+tt+'"'+(tt===x.t?' selected':'')+'>'+(tt==="ward"?"ward":tt==="day"?"daily":"optional")+'</option>';}).join("")+'</select>'
   +'<input class="nm" id="s764rn'+i+'" data-ri="'+i+'" data-f="n" value="'+esc(x.n)+'" placeholder="name"><input class="rt" id="s764rr'+i+'" type="number" data-ri="'+i+'" data-f="r" value="'+num(x.r)+'"><button class="del" data-del="'+i+'" title="Delete">✕</button>';});});
 return h;
}
function ratesSum(){return (S.ratesDirty?"UNSAVED · ":"")+wards().map(function(w){return w.n.split(" ")[0]+" "+rs(w.r);}).join(" · ")+(wards().length?" / day":"");}
function numIn(id,v){return '<input id="'+id+'" type="number" value="'+(v===""||v==null?"":num(v))+'">';}
function fold(key,label,val,inner){return '<details class="s764fold" data-f="'+key+'"'+(S.folds[key]?' open':'')+'><summary><span class="k">'+label+'</span><span class="v">'+val+'</span></summary><div class="in">'+inner+'</div></details>';}
function sheetHTML(){var e=S.est,c=calc(e);
 var top=e.src==null
  ?'<div class="s764bin"><label>Surgery ₹'+numIn("e_op",e.surgery)+'</label><label>Implant ₹ (basic)'+numIn("e_impl",e.implant)+'</label><label>Stay (days)'+numIn("e_stay",e.stay)+'</label></div>'
