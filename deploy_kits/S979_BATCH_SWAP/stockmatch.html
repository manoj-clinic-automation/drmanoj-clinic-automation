<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock milaan</title>
<!-- S404_ORTHO_STOCK_CLOSE (26-Sep-2026, D619): Darpan's stock match for the ORTHOTIC section of the 06-Sep count.
     Hindi (Roman script), phone-first, works on the PC. Two cards: Adla-badli? (Haan / Nahi per pair) and
     Kam kyun? (one answer per line). Every figure comes from /finance/stockmatch/api/...; nothing is computed here.
     One tap = saved (a big green card, S394); a repeat within ten minutes writes nothing and says so.
     S436_STAFF_PAGES_CLEAN (28-Sep-2026, D638): Kam kyun? offers ONE answer a side (the server sends it); a line the rule
     answered by default is shown for Darpan to confirm; the section's verdict comes from the server.
     S437_COUNT_PAGES_FINAL (28-Sep-2026, F-659) -- the owner: "The Badi kami section is a paragraph -- it should be a table:
     Marg quantity, physical count at the count, the difference, and the amount at selling rate, with a total below as well as
     the total at the top; Chhoti kami the same, collapsible. The bottom lines after the orthotics line are of no use -- remove;
     it should end with 'Orthotics band ho gaya' with the loss amount." So: his working cards first (Aaj ki ginti, the Sunday,
     Dobara ginna hai, Bina bill?, Stock batao, Kuchh gadbad hai); the answered pairs folded to one line; the open lines only
     while there are any; THE BLOCK LAST as tables (kul; Badi kami open with a total row; Chhoti kami collapsed; the orthotic
     line with its rows collapsed under it) -- and the page ends there. The verdict tail and the four status lines are gone.
     S502_STOCK_MILAAN_TODAY (10-Oct-2026, D699; F-812 .. F-815) -- the owner: "this should only show to Darpan what he needs to do and not
     what has already been done on the 6th September work." So the page shows ONLY today's work: Aaj ki ginti (an answered row can be
     corrected the same day -- 'Galat likha? Badlo' -> /api/spot/fix), the Sunday card, the swap pairs only while one is unanswered, the
     open lines he has not answered, Bina bill? only for claims without an answer, Stock batao, Kuchh gadbad hai?, and the last 7 days'
     shortages in plain words ('Pichhle 7 din mein kam nikla' -- information only). GONE from his page: the 06-Sep block and its note
     box, the progress bar, the heading '06-Sep ki ginti · round 1', Dobara ginna hai (it wrote into the sealed 06-Sep count, F-813),
     System ne dekha. Those stay on the owner's Loss desk. Every figure still comes from /api/state; nothing is computed here. -->
<style>
 body{font:16px/1.45 system-ui,sans-serif;margin:0;background:#f6f4f1;color:#1c1c1c;max-width:640px;margin:0 auto;padding:10px 12px 40px}
 h1{font-size:19px;margin:8px 0 2px}
 h2{font-size:17px;margin:0 0 6px}
 .sub{color:#777;font-size:13px;margin-bottom:8px}
 .card{background:#fff;border:1px solid #e4e0da;border-radius:10px;margin:10px 0;padding:12px 14px}
 .prog{background:#1c1c1c;color:#fff;border-radius:10px;padding:12px 14px;font-size:18px;font-weight:700;margin:10px 0}
 .row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;gap:8px}
 .k{color:#555}.v{font-weight:600;font-variant-numeric:tabular-nums}
 .pair,.line{border-top:1px solid #eee;padding:10px 0}
 .pair:first-of-type,.line:first-of-type{border-top:0}
 .pair.done,.line.done{background:#f1f7f2;margin:0 -14px;padding:10px 14px;border-radius:0}
 .pair.owner,.line.owner{background:#f3f3f3;color:#555}
 .nm{font-size:16px;font-weight:700}
 .muted{color:#888;font-size:13px}
 .btn{display:inline-block;border:1px solid #bbb;border-radius:9px;padding:12px 16px;margin:6px 8px 4px 0;background:#fafafa;font-size:17px;font-weight:600;cursor:pointer;user-select:none}
 .btn.ok{background:#2e6b34;color:#fff;border-color:#2e6b34}
 .btn.bad{background:#fff;color:#b3261e;border-color:#b3261e}
 .btn.chip{font-size:15px;padding:9px 12px;border-color:#3c6ac2;color:#3c6ac2;background:#fff}
 .btn.chip.on{background:#3c6ac2;color:#fff}
 .btn:active{opacity:.7}
 .ans{font-size:15px;font-weight:600;color:#2e6b34;margin-top:4px}
 .ans.owner{color:#555}
 .saved{background:#e4f2e6;border:2px solid #2e6b34;border-radius:12px;padding:14px;margin:10px 0}
 .saved .t{font-size:22px;font-weight:700;color:#2e6b34}
 .saved .l{font-size:18px;margin-top:4px}
 .saved.dup{background:#fdf1dc;border-color:#b26a00}.saved.dup .t{color:#b26a00}
 .saved.err{background:#fbe7e5;border-color:#b3261e}.saved.err .t{color:#b3261e}
 .empty{color:#888;font-style:italic;font-size:14px}
 .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#eee;margin-left:6px;vertical-align:middle}
 .blk{background:#2b1d1d;color:#fff;border-color:#2b1d1d}
 .blk .bl1{font-size:18px;font-weight:700}.blk .bl2{font-size:15px;opacity:.9;margin-top:2px}.blk .bl3{font-size:16px;font-weight:700;margin-top:6px;color:#ffd9d2;overflow-wrap:anywhere}
 .blk .muted{color:#d8cfcf}.blk input{border:1px solid #777;border-radius:8px;background:#fff;color:#1c1c1c}
 .blk details{margin-top:8px;border-top:1px solid #4a3535;padding-top:6px}
 .blk summary{cursor:pointer;font-size:16px;font-weight:700;list-style:none;padding:4px 0}
 .blk summary::-webkit-details-marker{display:none}
 .blk summary.big{color:#ffd9d2}.blk summary .dk{font-weight:400;font-size:13px;color:#d8cfcf;margin-left:6px}
 .blk .ol{font-size:16px;font-weight:700;color:#ffe9a8;margin-top:10px;border-top:1px solid #4a3535;padding-top:8px}
 table.bt{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
 table.bt th{font-weight:600;color:#d8cfcf;text-align:right;padding:4px 4px;border-bottom:1px solid #6a5050;font-size:12px}
 table.bt th:first-child,table.bt td:first-child{text-align:left}
 table.bt td{padding:5px 4px;text-align:right;border-bottom:1px solid #3d2c2c;vertical-align:top}
 table.bt td:first-child{font-weight:600;overflow-wrap:anywhere}
 table.bt tfoot td{font-weight:700;border-top:2px solid #d8cfcf;border-bottom:0;color:#fff}
 details.fold{margin:0}
 details.fold>summary{cursor:pointer;font-size:16px;font-weight:700;list-style:none;padding:4px 0}
 details.fold>summary::-webkit-details-marker{display:none}
 .sugg .btn{margin:4px 6px 0 0}
</style>
</head>
<body>
<h1>Stock milaan</h1>
<div class="sub" id="sub"></div>
<a id="s768count" href="/finance/stockmatch/count" style="display:inline-block;margin:6px 0 10px;padding:10px 14px;border-radius:8px;background:#0E5C58;color:#fff;font-weight:600;text-decoration:none">Orthotics ginti (shelf count) &rarr;</a>
<div id="body">loading&hellip;</div>
<script>
const el=id=>document.getElementById(id);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S=null, MSG=null, BUSY=false;
const CID=(new URLSearchParams(location.search).get("count")||"");
const Q=CID?("?count="+encodeURIComponent(CID)):"";

async function get(u){const r=await fetch(u+(u.indexOf("?")<0?"?":"&")+"_="+Date.now(),{cache:"no-store"});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){const e=new Error(j.message||j.error||("HTTP "+r.status));e.j=j;throw e;}return j;}
async function post(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){const e=new Error(j.message||j.error||("HTTP "+r.status));e.j=j;throw e;}return j;}

async function load(){
 try{S=await get("/finance/stockmatch/api/state"+Q);}catch(e){el("body").innerHTML='<div class="card">'+esc(e.message)+'</div>';return;}
 render();
}
function who(p){return p.answered_by==="darpan"?"Aapne":(p.answered_by?"Doctor sahab":"");}
function msgHtml(){if(!MSG)return "";return '<div class="saved '+(MSG.kind||"")+'"><div class="t">'+esc(MSG.title)+'</div>'+(MSG.lines||[]).map(l=>'<div class="l">'+l+'</div>').join("")+'</div>';}
function render(){
 const s=S; let h=msgHtml();
 h+=swapCards(s);                                            // S979 (D1113): Expiry batch -- shelf par dekhiye; Batch badlo (above Aaj ki ginti)
 h+=s428Top(s);                                              // S428 / S502: Aaj ki ginti (an answered row: 'Galat likha? Badlo' the same day), the count's Sunday
 h+=pairsCard(s);                                            // S502 (D699): only while a pair is unanswered, and only those pairs
 h+=linesCard(s);                                            // S502: only the open lines he has not answered (a defaulted line is finished work)
 h+=workCards(s);                                            // S502: Bina bill? (unanswered claims), Stock batao, Kuchh gadbad hai?, the last 7 days' shortages
 const R=(s.watch&&s.watch.roster)||null;
 el("sub").textContent="Aaj: "+((R&&R.day_text)?R.day_text:todayText());   // S502: the day only -- no '06-Sep ki ginti', no round
 el("body").innerHTML=h;
}
/* ---- S979 (D1113): the batch swap. An expiring batch Marg still holds beside a newer one: he checks the shelf (Nahi hai / Hai),
   then makes two Marg bills named STOCK (a sale of the old batch, a sale return on the newer batch, same rate). ---- */
function swapLine(x,b){return '<div class="muted" style="color:#1c1c1c;font-size:15px;margin:4px 0;padding-left:10px;border-left:3px solid #2e6b34">'+esc(x.item)+' &middot; '+esc(x.swap_hi)+' &middot; batch <b>'+esc(b?x.new_batch:x.old_batch)+'</b> ('+esc(b?x.new_exp:x.old_exp)+')</div>';}
function swapCards(s){
 const W=s&&s.swap; if(!W||!W.ok) return '';
 let h='';
 if(W.half&&W.half.length){
  h+='<div class="card" style="border:2px solid #b3261e"><h2>STOCK bill adhoora <span class="tag">'+W.half.length+'</span></h2><div class="muted">Sale report mein ek hi bill aaya. Yeh bill bhi Marg mein banaiye (naam STOCK, wahi rate):</div>';
  W.half.forEach(x=>{h+='<div class="line"><div class="nm">'+(x.missing==="ret"?'Bill 2 &middot; SALE RETURN':'Bill 1 &middot; SALE')+'</div>'+swapLine(x,x.missing==="ret")+'</div>';});
  h+='</div>';
 }
 if(W.ask&&W.ask.length){
  h+='<div class="card" style="border:2px solid #b4541a"><h2>Expiry batch &mdash; shelf par dekhiye <span class="tag">'+W.ask.length+'</span></h2><div class="muted">Marg mein yeh purana batch abhi bhi likha hai. Shelf par dekh kar bataiye.</div>';
  W.ask.forEach(x=>{
   h+='<div class="line"><div class="nm">'+esc(x.item)+'</div><div class="muted">batch '+esc(x.old_batch)+' &middot; exp '+esc(x.old_exp)+' &middot; Marg mein '+esc(x.paper_hi)+' &middot; aakhri bikri '+esc(x.last_sell)+'</div>'
    +'<div><span class="btn" onclick="swapAns('+x.id+',\'nahi\','+x.pack+')">Nahi hai</span></div>'
    +'<div class="row" style="justify-content:flex-start;flex-wrap:wrap;align-items:center"><b style="margin-right:6px">Hai &mdash;</b>'+boxes(x.pack,'Nag','x'+x.id)+' <span class="btn ok" onclick="swapAns('+x.id+',\'hai\','+x.pack+')">Bhej do</span></div></div>';
  });
  h+='</div>';
 }
 if(W.bills){
  const B=W.bills;
  h+='<div class="card" style="border:2px solid #2e6b34"><h2>Batch badlo &mdash; Marg mein sirf 2 bill</h2><div class="muted">Customer ka naam: <b>STOCK</b> &middot; cash nahi &middot; item ka total nahi badlega.</div>'
   +'<div class="line"><div class="nm">Bill 1 &middot; SALE &middot; naam STOCK</div>'+B.sale.map(x=>swapLine(x,false)).join('')+'</div>'
   +'<div class="line"><div class="nm">Bill 2 &middot; SALE RETURN &middot; naam STOCK &middot; wahi rate</div>'+B.ret.map(x=>swapLine(x,true)).join('')+'</div>'
   +'<div><span class="btn ok" onclick="swapBills()">Dono bill bana diye</span></div></div>';
 }
 if(W.made&&W.made.length){
  h+='<div class="card"><div class="muted">STOCK bill bana diye: '+W.made.map(x=>esc(x.item)).join(', ')+' &mdash; kal subah ki sale report se band hoga.</div></div>';
 }
 return h;
}
async function swapAns(id,ans,pack){
 if(BUSY)return;
 const body={case:id,answer:ans};
 if(ans==="hai"&&!readBoxes(pack,"x"+id,body)){MSG={kind:"err",title:"Shelf par kitna hai, likhiye",lines:[]};render();window.scrollTo(0,0);return;}
 BUSY=true;
 try{const j=await post("/finance/stockmatch/api/swap"+Q,body);after(j,"\u2713 Save ho gaya",[esc((j.saved||{}).message||"")]);}
 catch(e){MSG={kind:"err",title:"Nahi hua",lines:[esc(e.message)]};render();window.scrollTo(0,0);}
 BUSY=false;
}
async function swapBills(){
 const B=(S&&S.swap&&S.swap.bills)||null;
 if(BUSY||!B)return;
 BUSY=true;
 try{const j=await post("/finance/stockmatch/api/swap/bills"+Q,{ids:B.ids});after(j,"\u2713 Likh liya",[esc((j.saved||{}).message||"")]);}
 catch(e){MSG={kind:"err",title:"Nahi hua",lines:[esc(e.message)]};render();window.scrollTo(0,0);}
 BUSY=false;
}
function todayText(){const d=new Date();const p=n=>String(n).padStart(2,"0");return p(d.getDate())+"-"+p(d.getMonth()+1)+"-"+d.getFullYear();}
/* ---- card 1 -- the pairs: S437 folded to one line once every pair is answered ---- */
function pairsCard(s){
 const P=(s.pairs||[]).filter(p=>!p.answer&&!p.by_words);    // S502 (D699): an answered pair is finished work -- it leaves the page
 if(!P.length) return '';
 let h='<div class="card"><h2>Adla-badli? <span class="tag">'+P.length+'</span></h2><div class="muted">Ek size kam, doosra zyada &mdash; kya doosre size ka bill bana tha? Haan = adla-badli.</div>';
 P.forEach(p=>{
  h+='<div class="pair"><div class="row"><span class="k">Kam:</span><span class="nm">'+esc(p.short)+'</span></div>'+
     '<div class="row"><span class="k">Zyada:</span><span class="nm">'+esc(p.over)+'</span></div>'+
     '<div class="muted">'+esc(p.qty_text)+' &middot; '+esc(p.close)+(p.family?' &middot; '+esc(p.family):'')+'</div>'+
     '<div><span class="btn ok" onclick="pair(\''+esc(p.short).replace(/'/g,"\\'")+'\',\''+esc(p.over).replace(/'/g,"\\'")+'\',\'YES\')">Haan</span><span class="btn bad" onclick="pair(\''+esc(p.short).replace(/'/g,"\\'")+'\',\''+esc(p.over).replace(/'/g,"\\'")+'\',\'NO\')">Nahi</span></div></div>';
 });
 return h+'</div>';
}
/* ---- card 2 -- the lines: S436 ONE answer a side; S437 the card shows only while a line is still open or defaulted ---- */
function linesCard(s){
 const L=(s.lines||[]).filter(l=>l.open&&!l.defaulted);       // S502 (D699): the defaulted 06-Sep lines are finished work -- only what is still open
 if(!L.length) return '';
 const open2=L.filter(l=>!l.answered).length;
 let h='<div class="card"><h2>Kam kyun? <span class="tag">'+open2+'</span></h2><div class="muted">Adla-badli ke baad jo kam ya zyada bacha &mdash; ek tap: kam = bina bill bik gaya, zyada = bill bana par diya nahi.</div>';
 L.forEach(l=>{
  const own=l.reasoned&&l.cause_by&&l.cause_by!==s.user;
  h+='<div class="line'+(l.answered?(own||l.word?' owner':' done'):'')+'"><div class="nm">'+esc(l.item)+'</div>'+
     '<div class="muted">Marg '+l.marg+' &middot; gina '+l.counted+' &middot; <b>'+esc(l.rem_text)+'</b>'+(l.swapped?' &middot; adla-badli '+l.swapped+' ('+esc(l.swap_with.join(", "))+')':'')+'</div>';
  if(l.word) h+='<div class="ans owner">Doctor sahab: '+esc(l.word)+'</div>';
  if(l.reasoned) h+='<div class="ans'+(own?' owner':'')+'">'+(own?'Doctor sahab':'Aapne')+': '+esc(l.cause_hi)+(l.cause_at_text?' <span class="muted">('+esc(l.cause_at_text)+')</span>':'')+'</div>';
  if(!l.locked&&!l.word) h+='<div>'+l.reasons.map(r=>'<span class="btn chip'+(l.cause===r.key?' on':'')+'" onclick="reason('+l.diff_id+',\''+r.key+'\')">'+esc(r.hi)+'</span>').join("")+'</div>';
  h+='</div>';
 });
 return h+'</div>';
}
/* ---- S418 (D631) / S502 (D699): Bina bill? -- only the claims without an answer; then the S428 cards. (Dobara ginna hai and the
   06-Sep block are gone from this page: the count is sealed, F-813 / F-815; they stay on the owner's Loss desk.) ---- */
function workCards(s){
 let h='';
 const C=(s.claims||[]).filter(c=>!c.answer), A=s.claim_answers||[];
 if(C.length){
  h+='<div class="card"><h2>Bina bill? <span class="tag">'+C.length+'</span></h2><div class="muted">Doctor sahab in lines ka pata kar rahe hain &mdash; ek jawab chuniye.</div>';
  C.forEach(c=>{
   h+='<div class="line"><div class="nm">'+esc(c.item)+'</div>'+(c.short_qty?'<div class="muted">'+c.short_qty+' kam</div>':'');
   h+='<div>'+A.map(a=>'<span class="btn chip" onclick="claim('+c.id+',\''+a.key+'\')">'+esc(a.hi)+'</span>').join("")+'</div></div>';
  });
  h+='</div>';
 }
 h+=s428Cards(s);
 return h;
}
/* ---- S428 (D633): Darpan's side of the watch. Aaj ki ginti (the morning's items, on top), the count's Sunday
   (Theek hai / Nahi ho payega), the dated loss lines, Stock batao (any item, any day), Kuchh gadbad hai (what he sees -> the
   trace), Dekh liya on a trace. ---- */
function boxes(pack, whole, id){
 return pack>1?'<label>Patte <input id="ws'+id+'" inputmode="numeric" style="width:5em;font-size:17px;padding:8px"></label> <label>Goli <input id="wl'+id+'" inputmode="numeric" style="width:5em;font-size:17px;padding:8px"></label>'
  :'<label>'+esc(whole||'Nag')+' <input id="wl'+id+'" inputmode="numeric" style="width:6em;font-size:17px;padding:8px"></label>';
}
function readBoxes(pack, id, body){
 const a=el("ws"+id), b=el("wl"+id);
 if(pack>1){ body.strips=(a&&a.value)||0; body.loose=(b&&b.value)||0; return String((a&&a.value)||"").trim()!==""||String((b&&b.value)||"").trim()!==""; }
 body.pcs=(b&&b.value)||""; return String(body.pcs).trim()!=="";
}
function s428Top(s){
 const W=s.watch; if(!W||!W.ok) return '';
 let h='';
 const NW=W.now||{items:[]};                                  // S934: Abhi ginti -- the doctor's Count now, with the last bill number
 if(NW.items&&NW.items.length){
  if(SB===null) SB=sbLoad(NW.sitting_bill,NW.sitting_minutes,NW.sitting_age_s);   // S936 (D1047): ONE bill for the sitting, carried to every item
  if(SB&&!sbFresh()) SB='';                                     // the sitting is over: the old bill is never shown or sent again (the review, MUST 1)
  h+='<div class="card" style="border:2px solid #b4541a"><h2>Abhi ginti <span class="tag">'+NW.items.length+'</span></h2><div class="muted">Doctor sahab ne abhi ginne ko kaha hai. Shelf par jitna hai utna likhiye.</div>'
   +'<div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin:8px 0"><label><b>Aakhri sale bill no.</b> (Marg mein dekhiye) <input id="nbS" inputmode="numeric" value="'+esc(SB||'')+'" oninput="sbSet(this.value)" style="width:6em;font-size:17px;padding:8px"></label>'
   +(NW.last_no?' <span class="muted">'+esc(NW.last_day)+' ka aakhri bill '+NW.last_no+' tha</span>':'')
   +' <span class="btn" onclick="sbSale()">Sale hui? Naya bill likhiye</span></div>'
   +'<div class="muted">Yeh bill number is baithak ki har ginti ke saath jayega. Beech mein sale ho jaye to upar ka button dabaiye.</div>';
  NW.items.forEach(r=>{
   h+='<div class="line"><div class="nm">'+esc(r.item)+(r.recount?' <span class="tag">dobara ginti</span>':'')+'</div>'
    +(r.recount&&r.why_hi?'<div class="muted" style="color:#b4541a"><b>'+esc(r.why_hi)+'</b></div>':'')
    +'<div class="muted">'+esc(r.packing||'')+(r.pack>1?' &middot; ek patte mein '+r.pack:'')+' &middot; kaha '+esc(r.at_text)+'</div>'
    +'<div class="row" style="justify-content:flex-start;flex-wrap:wrap">'+boxes(r.pack,r.whole_hi,"n"+r.id)
    +' <span class="muted">Bill: <b class="sbShow">'+esc(SB||'\u2014')+'</b></span>'
    +'<span class="btn ok" onclick="nowSave('+r.id+','+r.pack+')">Bhej do</span></div></div>';
  });
  h+='</div>';
 }
 const R=W.roster||{items:[]};
 if(R.items.length){
  h+='<div class="card"><h2>Aaj ki ginti <span class="tag">'+R.open+'</span></h2><div class="muted">'+esc(R.day_text)+' &middot; yeh '+R.items.length+' item aaj subah gin kar likhiye. Shelf par jitna hai utna.</div>';
  R.items.forEach(r=>{
   h+='<div class="line'+(r.answered_at?' done':'')+'"><div class="nm">'+esc(r.item)+'</div><div class="muted">'+esc(r.packing||'')+(r.pack>1?' &middot; ek patte mein '+r.pack:'')+(r.reason_hi?' &middot; '+esc(r.reason_hi):'')+'</div>';
   if(r.answered_at){
    h+='<div class="ans">Aapne gina: <b>'+esc(r.qty_hi)+'</b></div>';
    if(r.can_fix){                                             // S502 (D699, F-812): the same day, the one who wrote it may correct it
     if(FIX===r.id) h+='<div class="muted">Sahi ginti likhiye:</div><div class="row" style="justify-content:flex-start;flex-wrap:wrap">'+boxes(r.pack,r.whole_hi,"f"+r.id)+'<span class="btn ok" onclick="spotFix('+r.id+','+r.pack+')">Badal do</span><span class="btn" onclick="FIX=null;render()">Rehne do</span></div>';
     else h+='<div><span class="btn chip" onclick="FIX='+r.id+';render()">Galat likha? Badlo</span></div>';
    }
   }
   else h+='<div class="row" style="justify-content:flex-start;flex-wrap:wrap">'+boxes(r.pack,r.whole_hi,"r"+r.id)+'<span class="btn ok" onclick="spot('+r.id+','+r.pack+')">Bhej do</span></div>';
   h+='</div>';
  });
  h+='</div>';
 }
 if(W.plan){
  h+='<div class="card"><h2>Poori ginti ka Sunday</h2><div class="muted">'+esc(W.plan.text_hi)+'</div>';
  if(!W.plan.confirmed) h+='<div><span class="btn ok" onclick="plan(\'ok\')">Theek hai</span><span class="btn bad" onclick="plan(\'no\')">Nahi ho payega</span></div>';
  h+='</div>';
 }
 return h;
}
let FIX=null;                                                   // S502: which answered row has its 'Badal do' boxes open (a page variable, no storage)
function s428Cards(s){
 const W=s.watch; if(!W||!W.ok) return '';
 let h='';
 h+='<div class="card"><h2>Stock batao</h2><div class="muted">Kisi bhi din, koi bhi item: naam likhiye, phir shelf par jitna hai utna likhiye.</div>';
 h+='<div class="row" style="justify-content:flex-start;flex-wrap:wrap"><input id="sq" placeholder="Item ka naam" oninput="wsearch(\'sq\',\'ssugg\',\'spick\')" autocomplete="off" style="flex:1;min-width:12em;font-size:17px;padding:8px"></div><div id="ssugg" class="sugg"></div>';
 if(SSEL){ h+='<div class="line"><div class="nm">'+esc(SSEL.item)+'</div><div class="muted">'+esc(SSEL.packing||'')+(SSEL.pack>1?' &middot; ek patte mein '+SSEL.pack:'')+'</div><div class="row" style="justify-content:flex-start;flex-wrap:wrap">'+boxes(SSEL.pack,SSEL.whole,"s")+'<span class="btn ok" onclick="stockBatao()">Likh do</span></div></div>'; }
 h+='</div>';
 h+='<div class="card"><h2>Kuchh gadbad hai?</h2><div class="muted">Koi item kam lag raha hai, ek-do dabbe nahi mil rahe? Item chuniye, kya dikh raha hai likhiye. System bikri aur kharid dekh kar batayega.</div>';
 h+='<div class="row" style="justify-content:flex-start;flex-wrap:wrap"><input id="gq" placeholder="Item ka naam" oninput="wsearch(\'gq\',\'gsugg\',\'gpick\')" autocomplete="off" style="flex:1;min-width:12em;font-size:17px;padding:8px"></div><div id="gsugg" class="sugg"></div>';
 if(GSEL){ h+='<div class="line"><div class="nm">'+esc(GSEL.item)+'</div><div class="muted">'+esc(GSEL.packing||'')+(GSEL.pack>1?' &middot; ek patte mein '+GSEL.pack:'')+'</div>'
   +'<div class="row" style="justify-content:flex-start;flex-wrap:wrap"><input id="gt" placeholder="Kya gadbad hai?" maxlength="500" style="flex:1;min-width:12em;font-size:16px;padding:8px"></div>'
   +'<div class="muted">Abhi shelf par kitna hai (likh sakein to):</div><div class="row" style="justify-content:flex-start;flex-wrap:wrap">'+boxes(GSEL.pack,GSEL.whole,"g")+'<span class="btn ok" onclick="gadbad()">Bhej do</span></div></div>'; }
 h+='</div>';
 if((W.losses||[]).length){                                   // S502 (D699): the last 7 days' shortages, information only -- the server's lines (voided ones never come)
  h+='<div class="card"><h2>Pichhle 7 din mein kam nikla</h2><div class="muted">Sirf jaankari ke liye &mdash; aapko kuchh nahi karna.</div>'+W.losses.map(l=>'<div class="line"><div class="nm">'+esc(l.text_hi)+'</div></div>').join("")+'</div>';
 }

let SSEL=null, GSEL=null, WSUGG={}, WT=null;
function wsearch(inp, box, pick){
 const q=(el(inp)?el(inp).value:"").trim(); clearTimeout(WT);
 if(q.length<2){ if(el(box)) el(box).innerHTML=""; return; }
 WT=setTimeout(async()=>{ try{ const j=await get("/finance/stockmatch/api/watch-items"+(Q?Q+"&":"?")+"q="+encodeURIComponent(q)); WSUGG[box]=j.items||[];
   if(el(box)) el(box).innerHTML=WSUGG[box].length?WSUGG[box].map((it,i)=>'<span class="btn chip" onclick="'+pick+'('+i+')">'+esc(it.item)+'</span>').join(""):'<div class="empty">Koi item nahi mila.</div>';
  }catch(e){ if(el(box)) el(box).innerHTML='<div class="empty">'+esc(e.message)+'</div>'; } },250);
}
function spick(i){ SSEL=WSUGG["ssugg"][i]; const q=el("sq")?el("sq").value:""; render(); if(el("sq")) el("sq").value=q; }
function gpick(i){ GSEL=WSUGG["gsugg"][i]; const q=el("gq")?el("gq").value:""; render(); if(el("gq")) el("gq").value=q; const t=el("gt"); if(t) t.focus(); }
async function spot(rid, pack){
 if(BUSY)return; const body={roster_id:rid};
 if(!readBoxes(pack,"r"+rid,body)){MSG={kind:"err",title:"Ginti likhiye",lines:[]};render();return;}
 BUSY=true;
 try{const j=await post("/finance/stockmatch/api/spot"+Q,body); after(j,"✓ Save ho gaya",[esc(j.saved.message)]);}
 catch(e){MSG={kind:"err",title:"Nahi hua",lines:[esc(e.message)]};render();window.scrollTo(0,0);}
 BUSY=false;
}
let SB=null, SBM=60, SBT=0;                                    // S936 (D1047): the sitting's bill on this phone, with the time it was last set or used
function sbKey(){const d=new Date();return 's936_bill_'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function sbLoad(srv,mins,age){SBM=+mins||60;let o=null;try{o=JSON.parse(sessionStorage.getItem(sbKey())||'null');}catch(e){o=null;}
 if(o&&typeof o==='object'&&(Date.now()-(+o.t||0))<=SBM*60000){SBT=+o.t||0;return o.b==='-'?'':String(o.b||'');}
 SBT=Date.now()-Math.max(0,(+age||0))*1000;return srv?String(srv):'';}   // review 2 (MUST 1): the server's bill keeps the clock of when it was keyed
function sbFresh(){return (Date.now()-SBT)<=SBM*60000;}
function sbSet(v){SB=String(v||'').replace(/\D/g,'');SBT=Date.now();try{sessionStorage.setItem(sbKey(),JSON.stringify({b:(SB||'-'),t:SBT}));}catch(e){}
 document.querySelectorAll('.sbShow').forEach(x=>{x.textContent=SB||'\u2014';});}
function sbSale(){sbSet('');const i=el('nbS');if(i){i.value='';i.focus();}}
async function nowSave(aid, pack){
 if(BUSY)return; const body={ask_id:aid};
 if(!readBoxes(pack,"n"+aid,body)){MSG={kind:"err",title:"Ginti likhiye",lines:[]};render();return;}
 const nb=el("nbS"); const v=String((nb&&nb.value)||SB||"").replace(/\D/g,'');
 if(v&&!sbFresh()){sbSet('');if(nb)nb.value='';MSG={kind:"err",title:"Aakhri bill dobara likhiye",lines:["Pichhla bill number purana ho gaya — nayi baithak hai."]};render();window.scrollTo(0,0);return;}   // the review, MUST 1
 body.last_bill=v; if(!v) body.no_bill=1;                      // S936: the sitting's bill, once
 BUSY=true;
 try{const j=await post("/finance/stockmatch/api/now"+Q,body); if(v) sbSet(v); after(j,"\u2713 Save ho gaya",[esc(j.saved.message)]);}
 catch(e){MSG={kind:"err",title:"Nahi hua",lines:[esc(e.message)]};render();window.scrollTo(0,0);}
 BUSY=false;
}
