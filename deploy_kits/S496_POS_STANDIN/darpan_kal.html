<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanjeevni — Kal ka hisaab</title>
<style>
 body{font:16px/1.45 system-ui,sans-serif;margin:0;background:#f6f4f1;color:#1c1c1c;
      max-width:560px;margin:0 auto;padding:10px 12px 70px}
 h1{font-size:19px;margin:8px 0 2px}
 .sub{color:#777;font-size:13px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
 .tabs{display:flex;gap:6px;margin:6px 0 10px}
 .tab{flex:1;text-align:center;padding:8px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:14px}
 .tab.on{background:#2e6b34;color:#fff;border-color:#2e6b34}
 .tab.off{color:#aaa;background:#f3f3f3}
 .sec{background:#fff;border:1px solid #e4e0da;border-radius:10px;margin:10px 0;padding:12px 14px}
 .row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
 .k{color:#555}.v{font-weight:600;font-variant-numeric:tabular-nums;font-size:18px}
 .tot{border-top:2px solid #1c1c1c;margin-top:6px;padding-top:6px}
 .tot .v{font-size:22px}
 details{margin-top:4px}summary{color:#3c6ac2;font-size:14px;cursor:pointer}
 table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
 td,th{padding:4px 6px;border-bottom:1px solid #eee;text-align:left}
 td.n{text-align:right;font-variant-numeric:tabular-nums}
 .btn{display:inline-block;border:1px solid #bbb;border-radius:8px;padding:10px 14px;
      margin:4px 6px 2px 0;background:#fafafa;font-size:15px;cursor:pointer}
 .btn.primary{background:#2e6b34;color:#fff;border-color:#2e6b34}
 .btn.pick{background:#fff;border-color:#3c6ac2;color:#3c6ac2;min-width:44%}
 .btn.pick.on{background:#3c6ac2;color:#fff}
 .btn.reason{display:block;width:100%;text-align:left;box-sizing:border-box;margin:6px 0}
 .big{width:100%;font-size:24px;padding:10px;border:1px solid #bbb;border-radius:8px;
      box-sizing:border-box;text-align:right}
 .ok{color:#2e6b34;font-weight:600}.bad{color:#b3261e;font-weight:600}.amber{color:#b26a00;font-weight:600}
 .muted{color:#888;font-size:13px}
 .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#eee;margin-left:6px}
 .badge.ok{background:#e4f2e6}.badge.bad{background:#fbe7e5}.badge.amber{background:#fdf1dc}
 .flag{border-left:4px solid #b26a00;padding-left:10px;margin:8px 0}
 input[type=date]{font-size:15px;padding:6px;border:1px solid #bbb;border-radius:8px}
 textarea{width:100%;box-sizing:border-box;font-size:15px;padding:8px;border:1px solid #bbb;border-radius:8px}
 #msg{position:fixed;bottom:0;left:0;right:0;background:#1c1c1c;color:#fff;padding:10px 14px;font-size:15px;display:none}
 a{color:#3c6ac2}
 /* S485 (D677): आज का ऑर्डर */
 .tab{cursor:pointer}
 #order{padding-bottom:96px}
 .ohead{margin:6px 2px 10px}
 details.osup{background:#fff;border:1px solid #e4e0da;border-radius:10px;margin:10px 0;padding:10px 12px}
 details.osup>summary{color:#1c1c1c;font-size:16px;padding:4px 0;line-height:1.7}
 .oln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #eee}
 .oln.held .oit{opacity:.55}
 .oit{flex:1;min-width:0;overflow-wrap:anywhere}
 .oqt{text-align:right;white-space:nowrap}
 .oq{display:inline-block;min-width:74px;text-align:center;font-size:16px}
 .btn.pm{min-width:44px;min-height:44px;padding:8px 0;text-align:center;font-size:20px;margin:0 2px;box-sizing:border-box}
 .btn.sm{padding:11px 10px;font-size:14px;margin:12px 0 0 6px;min-height:44px;box-sizing:border-box}
 #osheet .row .btn.sm{margin-top:0}
 .ochips .btn.sm{margin:10px 10px 0 0}
 .ost{display:inline-block}
 .opk{width:100%;margin:10px 0 2px;min-height:48px;font-size:17px;box-sizing:border-box}
 details.oyest{margin:14px 2px}
 #obar{position:fixed;left:0;right:0;bottom:0;display:none;gap:8px;padding:8px 12px;background:#f6f4f1;border-top:1px solid #ddd;
       box-sizing:border-box;max-width:584px;margin:0 auto;z-index:5}
 #obar .btn{flex:1;text-align:center;min-height:48px;box-sizing:border-box;margin:0;font-size:16px;padding:12px 6px}
 #msg{z-index:20}
 body.otab #msg{bottom:66px}
 #tabs .tab{min-height:44px;box-sizing:border-box;padding:11px 8px}
 #osheet{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);display:none;z-index:10}
 #osheet .box{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow:auto;background:#fff;border-radius:14px 14px 0 0;
       padding:14px;max-width:560px;margin:0 auto;box-sizing:border-box}
 .ohit{padding:10px 4px;border-bottom:1px solid #eee;cursor:pointer}
 .ochips{margin-top:4px}
</style>
</head>
<body>
<h1 id="ttl">Sanjeevni — Kal ka hisaab</h1>
<div class="sub"><input type="date" id="pick"> <span id="stat"></span>
 <a href="/finance/darpan" id="oldLink">din ka card ↗</a></div>
<div class="tabs" id="tabs">
 <div class="tab on" id="tabKal">कल का हिसाब</div>
 <div class="tab" id="tabOrder">आज का ऑर्डर</div>
 <div class="tab off" id="tabClaim" title="baad mein">Claim (jaldi)</div>
</div>
<div id="body">loading…</div>
<div id="order" style="display:none"></div>
<div id="obar"><span class="btn" id="oaddbtn" onclick="oaddOpen()">+ दवा जोड़ो</span><span class="btn primary" id="oall" onclick="opakkaAll()">सब पक्का</span></div>
<div id="osheet" onclick="if(event.target===this)oaddClose()"><div class="box"><div class="row"><b>दवा जोड़ो</b><span class="btn sm" onclick="oaddClose()">बंद करो</span></div>
 <input class="big" id="oq" style="text-align:left;font-size:20px" placeholder="नाम के पहले 3 अक्षर" autocomplete="off" autocapitalize="characters" oninput="oaddType()">
 <div class="muted">जैसे मार्ग में लिखते हैं</div><div id="ohits"></div></div></div>
<div id="msg"></div>
<script>
const R=p=>p==null?"—":"₹"+(Math.round(p)/100).toLocaleString("en-IN",{maximumFractionDigits:2});
const el=id=>document.getElementById(id);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const m=el("msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",4000);}
function yest(){const d=new Date(Date.now()-864e5);return d.toISOString().slice(0,10);}
const path=location.pathname.split("/");
let DATE=(/^\d{4}-\d{2}-\d{2}$/.test(path[path.length-1])?path[path.length-1]:yest());
const VIEW=new URLSearchParams(location.search).get("view")||"";
const OWNERVIEW=VIEW!=="staff";   /* S359: the owner lands on his English view; ?view=staff shows Darpan's form */
el("pick").value=DATE; el("pick").onchange=()=>{DATE=el("pick").value;load();};
let ME={kind:"staff"}, J=null, HANDED_TO=null, PICKED_REASON=null;

async function post(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
 const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw(j.message||j.error||"nahin hua");return j;}

const REASON_HI={home_not_in_print:"घर / प्रोसीजर दवा printout में नहीं थी",
 online_not_on_pos:"online payment POS पर नहीं दिखा", return_cash:"वापसी (return) नकद दी",
 carried:"बाकी कल दूँगा / कल दिया था", other:"और कुछ — दो शब्द लिखिए"};
const ANSWER_HI={slip_checked:"मरीज़ की पर्ची देखी", wrong_bill:"गलत बिल चुना गया", exchange:"बदली थी, पैसे नहीं दिए",
 doctor_said:"डॉक्टर ने कहा", other:"और कुछ — दो शब्द"};
const PARTY={dr_manoj:"Dr Manoj", dr_bhawna:"Dr Bhawna"};
const FLAG_HI={"NEVER BOUGHT":"यह दवा इस मरीज़ ने खरीदी नहीं थी","REFUNDED MORE THAN PAID":"जितना लिया उससे ज़्यादा वापस",
 "RETURNED MORE THAN SOLD":"जितना बिका उससे ज़्यादा वापस","DISCOUNTED RETURN":"discount वाला बिल पूरा वापस","LARGE RETURN":"बड़ी वापसी"};

function sec(h){return '<div class="sec">'+h+'</div>';}
function bills(list){if(!list.length)return '<div class="muted">कोई नहीं</div>';
 return '<table>'+list.map(b=>'<tr><td>'+esc(b.bill)+'</td><td class="muted">'+(b.src==="typed"?"typed":"Marg")+'</td><td class="n">'+R(b.amount_p)+'</td></tr>').join("")+'</table>';}

async function load(){
 el("body").innerHTML="loading…";
 let r=await fetch("/finance/darpan/kal/api/day?date="+DATE+"&_="+Date.now(),{cache:"no-store"});
 let j=await r.json().catch(()=>({}));
 if(!j.ok){el("body").innerHTML=sec('<span class="bad">'+esc(j.message||j.error||"nahin khula")+'</span>');return;}
 J=j; ME=j.me||ME;
 if(ME.kind==="recipient"){return renderMine();}
 if(ME.kind==="owner"&&OWNERVIEW){return renderOwner(j);}
 renderStaff(j);
}

function renderStaff(j){
 const c=j.calc, d=j.day, tol=j.tolerance_p;
 el("stat").textContent=c.applied?("report आ गई · "+c.bills_n+" bill"):"";
 let h="";
 if(!c.applied){
  h+=sec('<div class="row"><span class="k">कल की बिक्री की report</span><span class="amber">अभी नहीं आई</span></div>'+
   '<div class="muted">Marg की report server पर आते ही यह पेज भर जाएगा। आप cash का amount अभी भी लिख सकते हैं — हिसाब report आने पर होगा।</div>');
 }else{
  h+=sec('<div class="row"><span class="k">कल की बिक्री (Marg)</span><span class="v">'+R(c.net_sale_p)+'</span></div>'+
   (c.returns_p?'<div class="muted">('+R(c.gross_p)+' बिक्री − '+R(c.returns_p)+' वापसी'+(c.review_p?' + '+R(c.review_p)+' बिना नाम':'')+')</div>':'')+
   '<div class="row"><span class="k">− घर / प्रोसीजर की दवा</span><span class="v">'+R(c.home_p+c.proc_p)+'</span></div>'+
   '<details><summary>कौन से बिल</summary>'+bills(c.home_bills.concat(c.proc_bills))+'</details>'+
   '<div class="row"><span class="k">− Online (UPI / card)'+(c.online_provisional?(c.online_source==="pos"?'<span class="badge amber">POS total से — bank की report बाकी</span>':'<span class="badge amber">bank की report बाकी</span>'):'<span class="badge ok">bank से</span>')+'</span><span class="v">'+R(c.online_p)+'</span></div>'+
   (c.online_txns.length?'<details><summary>'+c.online_txns.length+' payment</summary><table>'+c.online_txns.map(t=>'<tr><td>'+esc(t.time||"")+'</td><td class="muted">'+esc(t.mode||"")+'</td><td class="n">'+R(t.amount_p)+'</td></tr>').join("")+'</table></details>':'')+
   (c.adjust_p?'<div class="row"><span class="k">'+(c.adjust_p>0?'+':'−')+' सुधार (घर / प्रोसीजर की दवा वापस — cash नहीं)</span><span class="v">'+R(Math.abs(c.adjust_p))+'</span></div>':'')+
   '<div class="row tot"><span class="k">= इतना cash होना चाहिए</span><span class="v">'+R(c.expected_p)+'</span></div>');
 }
 // the two inputs
 const done=d&&d.handed_p!=null;
 HANDED_TO=done?d.handed_to:HANDED_TO;
 let ih='<div class="row"><span class="k">कितना cash दिया?</span></div>'+
  '<input class="big" id="handed" inputmode="numeric" placeholder="₹" value="'+(done?(d.handed_p/100):"")+'"'+(d&&d.received_at?' disabled':'')+'>'+
  '<div class="row" style="margin-top:8px"><span class="k">किसको दिया?</span></div>'+
  '<div>'+["dr_manoj","dr_bhawna"].map(p=>'<span class="btn pick'+(HANDED_TO===p?' on':'')+'" onclick="pickParty(\''+p+'\')">'+PARTY[p]+'</span>').join("")+'</div>';
 if(!(d&&d.received_at)) ih+='<button class="btn primary" style="width:100%;margin-top:8px" onclick="save()">'+(done?"बदल कर लिखिए":"लिख दीजिए")+'</button>';
 ih+=posField(j.pos_total);   /* S496: the one optional figure, only while the bank's report is missing after its time */
 h+=sec(ih);
 // the result
 if(done){
  const diff=d.diff_p;
  let rh="";
  if(d.state==="waiting_report") rh='<span class="amber">report आने पर हिसाब होगा</span>';
  else if(diff!=null&&Math.abs(diff)<=tol) rh='<span class="ok">✓ हिसाब मिल गया</span><div class="muted">दिन पूरा। किसी को कुछ नहीं कहना।</div>';
  else if(diff>0) rh='<span class="ok">✓ लिख लिया</span> <span class="badge amber">'+R(diff)+' ज़्यादा</span><div class="muted">यह रकम आपको वापस मिलेगी — नीचे "आपको वापस" में दिखेगी।</div>';
  else{
   rh='<span class="bad">'+R(-diff)+' कम</span>';
   if(d.state==="open"){
    rh+='<div class="muted" style="margin:6px 0">वजह चुनिए:</div>'+
     Object.keys(REASON_HI).map(k=>'<span class="btn reason'+(PICKED_REASON===k?' on':'')+'" onclick="pickReason(\''+k+'\')">'+REASON_HI[k]+'</span>').join("")+
     '<textarea id="rnote" rows="2" placeholder="दो शब्द (ज़रूरी सिर्फ़ \'और कुछ\' पर)"></textarea>'+
     '<button class="btn primary" style="width:100%;margin-top:6px" onclick="saveReason()">वजह भेजिए</button>';
   }else{
    const V={confirmed:'<span class="badge ok">मिलान हो गया</span>',not_confirmable:'<span class="badge">आपकी बात दर्ज</span>',contradicted:'<span class="badge bad">डॉक्टर साहब देखेंगे</span>'};
    rh+='<div style="margin-top:6px">वजह: '+esc(REASON_HI[d.reason]||d.reason)+(d.reason_note?' — '+esc(d.reason_note):'')+' '+(V[d.verdict]||"")+'</div>';
    if(d.owner_decision==="ask"&&d.owner_note) rh+='<div class="flag">डॉक्टर साहब का सवाल: '+esc(d.owner_note)+'</div>';
   }
  }
  if(d.state!=="waiting_report") rh+='<div class="muted" style="margin-top:6px">'+PARTY[d.handed_to]+' को '+R(d.handed_p)+' · '+(d.received_at?'<span class="ok">मिल गया ✓</span>':'<span class="amber">अभी "मिला" नहीं लगा</span>')+'</div>';
  h+=sec(rh);
 }
 // owed back to him
 if((j.owed||[]).length){
  h+=sec('<div class="row"><span class="k">आपको वापस मिलना है</span><span class="v">'+R(j.owed.reduce((a,o)=>a+o.amount_p,0))+'</span></div>'+
   '<table>'+j.owed.map(o=>'<tr><td>'+o.business_date+'</td><td class="n">'+R(o.amount_p)+(o.provisional?' <span class="badge amber">bank बाकी</span>':'')+'</td></tr>').join("")+'</table>');
 }
 // returns
 const rt=j.returns;
 let vh='<div class="row"><span class="k">कल की वापसी</span><span class="v">'+rt.count+(rt.count?' <span class="muted" style="font-size:14px">('+R(rt.total_p)+')</span>':'')+'</span></div>';
 if(!rt.flagged.length) vh+='<div class="muted">'+(rt.count?"सब ठीक — कुछ नहीं पूछना।":"कोई वापसी नहीं।")+'</div>';
 rt.flagged.forEach(f=>{
  vh+='<div class="flag"><div><b>'+esc(f.bill)+'</b> · '+R(f.amount_p)+' <span class="badge amber">'+esc(FLAG_HI[f.flag]||f.flag)+'</span></div>'+
   (f.lines.length?'<div class="muted">'+f.lines.map(l=>esc(l.item)+(l.qty?' ×'+esc(l.qty):'')).join(" · ")+'</div>':'');
  if(f.answered) vh+='<div class="ok">✓ '+esc(ANSWER_HI[f.answered.answer]||f.answered.answer)+(f.answered.note?' — '+esc(f.answered.note):'')+'</div>';
  else vh+='<div>'+Object.keys(ANSWER_HI).map(k=>'<span class="btn" onclick="answerReturn(\''+esc(f.bill)+'\',\''+k+'\',\''+esc(f.flag)+'\')">'+ANSWER_HI[k]+'</span>').join("")+'</div>';
  vh+='</div>';
 });
 h+=sec(vh);
 h+=orderSheetSec(j.order_sheet);   /* S454 (D666): Order sheet -- mil gayi / adhoori; the one instruction */
 h+=orthoShortSec(j.ortho_short);   /* S403 (D618): Orthotic kam hai -- N */
 h+=ordersTodaySec(j.orders_today); /* S410 (D626): Aaj ke order -- N (M bheja) */
 h+=amirClaimsSec(j.amir_claims);   /* S446 (D648): Amir ke claim -- two taps, nothing to type */
 el("body").innerHTML=h;
}
/* S454 (D666): his order sheet -- when the newest came, how many medicines and suppliers, that reception has it; or that it was refused.
   Always the one instruction under it. */
function orderSheetSec(o){
 if(!o||!o.ok) return "";
 let t='<div class="row"><span class="k"><b>Order sheet</b></span></div>';
 if(o.refused) t+='<div class="bad">Order sheet adhoori thi, system ne nahi li</div><div class="muted">Marg se dobara TEXT mein save kijiye.</div>';
 else if(o.sheet) t+='<div><b>'+esc(o.sheet.date)+' ki sheet mil gayi</b></div><div class="muted">'+o.sheet.dawa+' dawa · '+o.sheet.suppliers+' supplier · reception ke paas pahunch gayi</div>';
 t+='<div class="muted" style="margin-top:6px">Marg mein order banane ke baad report ko TEXT mein save kijiye, jaise stock report save hoti hai. Naam badalne ki zaroorat nahi.</div>';
 return sec(t);
}
/* S410 (D626): 'Aaj ke order -- N (M bheja)' -- the count line; opens the Purchase orders screen */
function ordersTodaySec(o){
 if(!o||!o.ok||!o.n) return "";
 return sec('<div class="row"><span class="k">Aaj ke order — <b>'+o.n+'</b> ('+o.sent+' bheja'+(o.unsent?', <span class="amber">'+o.unsent+' baaki</span>':'')+')</span></div>'+
  (o.text?'<div class="muted">'+esc(o.text)+'</div>':'')+(o.frozen?'<div class="bad">Medicine ordering band hai</div>':'')+
  '<a class="btn primary" href="'+esc(o.url||"/finance/porders")+'">Purchase orders खोलें ↗</a>');
}
/* S403 (D618): 'Orthotic kam hai -- N' -- collapsed; the list; a button that opens the Purchase orders screen */
function orthoShortSec(o){
 if(!o||!o.ok) return "";
 const n=o.n||0;
 return sec('<details><summary><span class="k">Orthotic kam hai — <b>'+n+'</b></span>'+(n?'':' <span class="ok">सब ठीक</span>')+'</summary>'+
  (n?'<table>'+o.items.map(x=>'<tr><td>'+esc(x.item)+'</td><td class="n">'+x.short+' kam'+(x.approx?' <span class="badge amber">approx</span>':'')+'</td></tr>').join("")+'</table>':'')+
  (o.sent?'<div class="muted">order bheja: '+esc(o.sent.sent_text)+' · '+esc(o.sent.by)+'</div>':'')+
  '<a class="btn primary" href="'+esc(o.url||"/finance/porders")+'">Purchase orders खोलें ↗</a></details>');
}
/* S446 (D648): Amir ke claim -- his supplier claims, Darpan's queue: supplier, bill, amount, raised when; two taps */
function amirClaimsSec(c){
 if(!c||!c.length) return "";
 return sec('<div class="row"><span class="k">Amir ke claim — <b>'+c.length+'</b></span></div>'+c.map(x=>'<div class="flag" data-claim="'+x.id+'"><div><b>'+esc(x.supplier)+'</b> · bill '+esc(x.bill_no)+' · '+R(x.amount_p||0)+' <span class="badge amber">'+esc(x.reason_hi)+'</span></div>'+
  '<div class="muted">'+esc(x.raised_at)+' · '+esc(x.raised_by)+(x.contacted?' · '+esc(x.contacted):'')+'</div><div>'+
  (x.state!=="contacted"?'<span class="btn" onclick="answerClaim('+x.id+',\'baat_hui\')">Supplier se baat ho gayi</span>':'')+
  '<span class="btn" onclick="answerClaim('+x.id+',\'mil_gaya\')">Credit / maal mil gaya</span></div></div>').join(""));
}
async function answerClaim(id,ans){try{await post("/finance/darpan/kal/api/claim-answer",{id:id,answer:ans});load();}catch(e){toast(""+e);}}
function pickParty(p){HANDED_TO=p;document.querySelectorAll(".btn.pick").forEach(b=>b.classList.toggle("on",b.textContent===PARTY[p]));}
function pickReason(k){PICKED_REASON=k;document.querySelectorAll(".btn.reason").forEach(b=>b.classList.toggle("on",b.textContent===REASON_HI[k]));}
/* S496 (the owner, 07-Oct-2026): when the bank's report for the day has not come after its time, the SAME card offers
   ONE optional figure -- the UPI total read from the POS machine -- in its own tinted box with its own button.
   It counts only after Dr Manoj confirms it. save() below is untouched. */
function posField(p){
 if(!p||!p.ok||!p.show) return "";
 let t='<div style="margin-top:14px;padding:10px 12px;border:1px dashed #b26a00;border-radius:10px;background:#fffaf0">'+
  '<div class="row"><span class="k"><b>कल का UPI total — POS मशीन से</b> <span class="badge amber">ज़रूरी नहीं</span></span></div>';
 if(p.confirmed) return t+'<div class="ok">✓ POS total '+R(p.confirmed.amount_p)+' — डॉक्टर साहब ने हाँ कर दी</div><div class="muted">Bank की report आने तक यही गिना जाएगा।</div></div>';
 if(p.typed) t+='<div class="amber">POS total '+R(p.typed.amount_p)+' लिखा है — डॉक्टर साहब की हाँ बाकी</div>';
 else if(p.rejected) t+='<div class="bad">डॉक्टर साहब ने '+R(p.rejected.amount_p)+' वाला total नहीं माना — POS मशीन दोबारा देखकर लिखिए</div>';
 if(!p.offer) return t+'</div>';
 if(p.typed) t+='<div class="muted" style="margin:4px 0 6px">गलत लिखा हो तो सही total लिखकर दोबारा भेजिए।</div>';
 else if(!p.rejected) t+='<div class="muted" style="margin:4px 0 6px">Bank की report अभी नहीं आई। POS मशीन में कल का UPI total देखकर लिख दीजिए। डॉक्टर साहब के हाँ करने पर ही यह गिना जाएगा।</div>';
 return t+'<input class="big" id="postotal" inputmode="numeric" placeholder="₹" style="font-size:20px" value="'+(p.typed?(p.typed.amount_p/100):"")+'">'+
  '<button class="btn" style="width:100%;margin:8px 0 0;font:inherit;border-color:#b26a00;color:#7a4a00;background:#fff" onclick="savePos()">'+((p.typed||p.rejected)?"POS total दोबारा भेजिए":"POS total भेजिए")+'</button></div>';
}

/* ---- S359: cash received -- the doctors log what Darpan handed (one day, or the whole backlog) ---- */
let PENDING=null;
async function pendingHTML(){
 const r=await fetch("/finance/darpan/kal/api/pending?_="+Date.now(),{cache:"no-store"}); const j=await r.json().catch(()=>({}));
 if(!j.ok) return "";
 PENDING=j;
 const owner=j.me.kind==="owner"; const me=j.me.party;
 const unl=j.days.filter(d=>d.kind==="unlogged"), unr=j.days.filter(d=>d.kind==="unreceived");
 if(!unl.length&&!unr.length) return sec('<div class="row"><span class="k">Cash received</span><span class="ok">every day since '+esc(j.log_from)+' is logged and received ✓</span></div>');
 let h='<div class="row"><span class="k">Cash received</span><span class="'+(unl.length?'amber':'ok')+'">'+unl.length+' day(s) not logged'+(unr.length?' · '+unr.length+' typed by Darpan, not yet received':'')+'</span></div>';
 h+='<div class="muted">Darpan hands the cash daily. Log what you received: the amount is prefilled with the day\'s expected cash — change it if he gave a different sum. Each log lands as cash out of the drawer to '+(owner?'the doctor named':'you')+'.</div>';
 if(unr.length){h+='<table>'+unr.map(d=>'<tr><td>'+d.date+'</td><td class="n">'+R(d.handed_p)+'</td><td>→ '+PARTY[d.handed_to]+'</td><td>'+
   (owner||d.handed_to===me?'<span class="btn primary" onclick="logDay(\''+d.date+'\',null,\''+d.handed_to+'\')">received</span>':'')+'</td></tr>').join("")+'</table>';}
 if(unl.length){
  h+='<table>'+unl.map(d=>'<tr><td>'+d.date+(d.applied?'':' <span class="amber">no report</span>')+(d.online_provisional?' <span class="badge amber">bank pending</span>':'')+'</td>'+
    '<td class="n"><input type="number" id="amt-'+d.date+'" value="'+(d.expected_p==null?'':Math.round(d.expected_p)/100)+'" style="width:96px;font-size:15px;padding:4px"></td>'+
    '<td>'+(owner?'<span class="btn primary" onclick="logDay(\''+d.date+'\',true,\'dr_manoj\')">to me</span><span class="btn" onclick="logDay(\''+d.date+'\',true,\'dr_bhawna\')">to Dr Bhawna</span>'
               :'<span class="btn primary" onclick="logDay(\''+d.date+'\',true,\''+me+'\')">received</span>')+'</td></tr>').join("")+'</table>';
  const can=unl.filter(d=>d.expected_p!=null&&d.applied);
  h+='<div class="muted">Expected in all: '+R(j.expected_total_p)+' over '+can.length+' day(s) with a report.</div>';
  h+='<div>'+(owner?'<span class="btn" onclick="logAll(\'dr_manoj\')">log all as expected → to me</span><span class="btn" onclick="logAll(\'dr_bhawna\')">→ to Dr Bhawna</span>'
                   :'<span class="btn" onclick="logAll(\''+me+'\')">log all as expected → received by me</span>')+'</div>';
 }
 return sec(h);
}
async function logDay(date,useBox,party){
 const b={date:date,party:party};
 if(useBox){const v=parseFloat((el("amt-"+date)||{}).value); if(isNaN(v)||v<0){toast("Amount?");return;} b.amount_p=Math.round(v*100);}
 try{const j=await post("/finance/darpan/kal/api/log",b); const r=(j.results||[])[0]||{}; toast(r.ok?("Logged "+date+" · "+R(r.handed_p)+" → "+PARTY[r.handed_to]+(r.diff_p&&Math.abs(r.diff_p)>0?" · difference "+R(r.diff_p):"")):(r.message||r.error||"not logged")); load();}catch(e){toast(""+e);}
}
async function logAll(party){
 if(!PENDING) return;
 const dates=PENDING.days.filter(d=>d.kind==="unlogged"&&d.applied&&d.expected_p!=null).map(d=>d.date);
 if(!dates.length){toast("Nothing to log");return;}
 if(!confirm("Log "+dates.length+" day(s) as received exactly as expected, "+R(PENDING.expected_total_p)+" in all, to "+PARTY[party]+"?")) return;
 try{const j=await post("/finance/darpan/kal/api/log",{dates:dates,as_expected:true,party:party}); toast("Logged "+j.logged+" of "+dates.length); load();}catch(e){toast(""+e);}
}

   here never touches कल का हिसाब. No reload on a tap: every answer is the day's list again, and the open blocks stay open. ---- */
const OU="/finance/darpan/kal/api/order";
const OWD=["रवि","सोम","मंगल","बुध","गुरु","शुक्र","शनि"];
let OTAB=false, OJ=null, OOPEN={}, OWNER_RO=false, OADD=null;

el("tabKal").onclick=()=>showTab(false); el("tabOrder").onclick=()=>showTab(true);

 if(y.length){
  const W={arrived:s=>'ऑर्डर हो गया '+esc(s.at)+' · <span class="ok">माल आया ✓</span>',ordered:s=>'ऑर्डर हो गया '+esc(s.at)+' · <span class="amber">अभी नहीं आया</span>',
   no_answer:s=>'<span class="amber">फ़ोन नहीं उठा — रिसेप्शन फिर करेगी</span>',not_ordered:s=>'<span class="amber">ऑर्डर बाकी</span>'};
  h+='<details class="oyest"><summary>कल के ऑर्डर — क्या हुआ ('+y.length+')</summary><table>'+y.map(s=>'<tr><td>'+esc(s.display)+'</td><td>'+(W[s.state]||W.ordered)(s)+'</td></tr>').join("")+'</table></details>';
 }
 el("order").innerHTML=h;
 const anyOpen=j.suppliers.some(b=>b.status==="open");
 el("obar").style.display=(OTAB&&can)?"flex":"none";
 el("oall").style.display=anyOpen?"":"none";
}
/* the fold is set AFTER the answer: a toggle event of the blocks drawn before the tap can land while the tap is in flight */
async function opakka(sn){const j=await otap("/pakka",{supplier_norm:sn}); if(j){OOPEN[sn]=false; renderOrder(); toast("✓ पक्का — रिसेप्शन को गया");}}
async function opakkaAll(){if(!OJ) return; const j=await otap("/pakka",{all:true}); if(j){OJ.suppliers.forEach(b=>{OOPEN[b.supplier_norm]=false;}); renderOrder(); toast("सब पक्का — रिसेप्शन ऑर्डर करेगी।");}}
/* the add sheet: three letters of a name, then a tap; a medicine never bought asks for its supplier */
function oaddOpen(){OADD=null; el("osheet").style.display="block"; el("oq").value=""; el("ohits").innerHTML=""; el("oq").focus();}
function oaddClose(){el("osheet").style.display="none";}
let OQT=null;
function oaddType(){clearTimeout(OQT); OQT=setTimeout(oaddFind,250);}
async function oaddFind(){
 const q=el("oq").value.trim(); OADD=null;
 if(q.length<3){el("ohits").innerHTML=""; return;}
 try{const r=await fetch(OU+"/items?q="+encodeURIComponent(q)+"&_="+Date.now(),{cache:"no-store"}); const j=await r.json(); if(!j.ok) throw 0;
  window.OCHIPS=j.chips||[];
  el("ohits").innerHTML=j.hits.length?j.hits.map((x,i)=>'<div class="ohit" id="ohit'+i+'" onclick=\'oaddPick('+i+','+oesc(JSON.stringify(x))+')\'><b>'+esc(x.item)+'</b> <span class="muted">'+esc(x.packing)+'</span>'+
   '<div class="muted">'+(x.supplier?esc(x.supplier)+' · '+oqty(x.qty,x.unit):'<span class="amber">सप्लायर चुनिए</span>')+'</div><div class="ochips" id="ochips'+i+'"></div></div>').join(""):'<div class="muted">इस नाम की दवा नहीं मिली</div>';
 }catch(e){el("ohits").innerHTML='<div class="amber">सूची अभी नहीं खुली — थोड़ी देर में फिर देखिए</div>';}
}
async function oaddPick(i,x){
 if(x.supplier_norm){const j=await otap("/add",{item:x.item}); if(j){oaddClose(); OOPEN[j.added.supplier_norm]=true; renderOrder(); toast("जोड़ी — "+x.item);} return;}
 el("ochips"+i).innerHTML=(window.OCHIPS||[]).map(c=>'<span class="btn sm" onclick=\'event.stopPropagation();oaddWith('+oesc(JSON.stringify(x.item))+','+oesc(JSON.stringify(c.supplier_norm))+')\'>'+esc(c.display)+'</span>').join("");
}
async function oaddWith(item,sn){const j=await otap("/add",{item:item,supplier_norm:sn}); if(j){oaddClose(); OOPEN[sn]=true; renderOrder(); toast("जोड़ी — "+item);}}
load();
if(location.hash==="#order") showTab(true);   /* S485: the 09:30 notice lands on the tab */
</script>
