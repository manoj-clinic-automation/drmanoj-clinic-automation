# OpenLiteSpeed vhost context — append inside the portal vhost.
# Serves the finance module at /finance on the SAME origin as the portal, so the
# SSO cookie is sent and no cross-origin credentialed fetch is needed (F-68).
context /finance {
  type                    proxy
  handler                 finance
  addDefaultCharset       off
}
